[Login]
# jsui-wm: Lomiri normally holds logind's power-key inhibitor; without it a
# short press powers the tablet off. repowerd handles the key (screen on/off).
# Installed by install.sh --system as /etc/systemd/logind.conf.d/jsui-wm.conf.
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
