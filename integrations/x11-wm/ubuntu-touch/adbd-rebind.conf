# /etc/systemd/system/adbd.service.d/jsui-rebind.conf (install.sh --system)
# adbd on the Tab A7's port has crashed (SIGSEGV) a few times under heavy
# transfers. systemd restarts it, but the USB gadget never binds its new
# FunctionFS instance ("timed out while waiting for FUNCTIONFS_BIND") until
# the cable is replugged. Re-attaching the gadget's UDC after each start
# brings adb back by itself.
[Service]
ExecStartPost=-/bin/sh -c 'sleep 1; for g in /sys/kernel/config/usb_gadget/*; do u=$(cat "$g/UDC" 2>/dev/null); [ -n "$u" ] || u=$(ls /sys/class/udc | head -1); [ -n "$u" ] || continue; echo "" > "$g/UDC" 2>/dev/null; echo "$u" > "$g/UDC"; done'
