name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  # ------------------------------------------------------------------ changes
  # Pull requests only run the jobs whose inputs changed (pushes to main and
  # manual runs build everything). CI config changes run everything.
  changes:
    name: changes
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'avrea-ubuntu-latest-4-vcpu' }}
    # paths-filter lists the PR's files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.filter.outputs.native }}
      wasm: ${{ steps.filter.outputs.wasm }}
      godot: ${{ steps.filter.outputs.godot }}
      js: ${{ steps.filter.outputs.js }}
      reference: ${{ steps.filter.outputs.reference }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core: &core
              - 'src/**'
              - 'include/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'assets/**'
              - '.github/workflows/**'
            native:
              - *core
              - 'tools/**'
              - 'tests/native/**'
              - 'web/test/fixtures/**'
            wasm:
              - *core
              - 'scripts/**'
              - 'web/**'
              - 'site/**'
            godot:
              - *core
              - 'integrations/godot/**'
              - 'scripts/build-skia-desktop.sh'
              - 'scripts/patches/skia-m157-dawn-header-only.patch'
              - 'tools/dawn-shim/**'
              - 'tests/native/**'
              - 'packages/**'
              - 'examples/showcase/**'
              - 'examples/theme.js'
              - 'examples/assets/**'
            js:
              - *core
              - 'packages/**'
              - 'tests/native/**'
              - 'package.json'
              - 'package-lock.json'
            ios:
              - *core
              - 'integrations/ios/**'
              - 'scripts/build-skia-ios.sh'
              - 'scripts/build-ios.sh'
            reference:
              - *core
              - 'tools/jsui-render/**'
              - 'packages/**'
              - 'examples/**'
              - 'tests/reference/**'
              - 'package-lock.json'

  # ------------------------------------------------------------ native (Linux)
  native:
    name: native (ubuntu, clang)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'avrea-ubuntu-latest-4-vcpu' }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.native == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang libfontconfig1-dev zlib1g-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libgl1-mesa-dev \
            libegl1 libegl-mesa0 libgl1-mesa-dri xvfb xauth
      - name: Cache prebuilt Skia + FetchContent sources
        uses: actions/cache@v4
        with:
          path: |
            third_party/skia-prebuilt
            build/_deps/*-src
          key: native-deps-${{ runner.os }}-${{ hashFiles('cmake/*.cmake', 'tools/**/CMakeLists.txt') }}
          restore-keys: native-deps-${{ runner.os }}-
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native-${{ runner.os }}
          max-size: 500M
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j "$(nproc)"
      - name: Native tests
        # Mesa's surfaceless EGL (llvmpipe) gives the GPU tests a real GL
        # context; require it so a broken setup cannot silently SKIP them.
        env:
          JSUI_GPU_TEST_REQUIRE: 1
        run: ./build/jsui-tests
      - name: Render smoke
        run: ./build/jsui-render web/test/fixtures/bands.js -o bands.png --width 320 --height 200
      - name: Recorder smoke (jsui-record, fixed-clock timeline)
        run: |
          ./build/jsui-record web/test/fixtures/bands.js --timeline tools/jsui-record/smoke.json \
            --width 320 --height 200 --frames record-smoke/frames --stills record-smoke/stills
          test "$(ls record-smoke/frames | wc -l)" -eq 84
          test -s record-smoke/stills/click.png && test -s record-smoke/stills/pad.png
      - name: Viewer GPU smoke (Xvfb + Mesa GL)
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" ./build/tools/jsui-viewer/jsui-viewer --gpu --width 320 --height 200 \
            --frames 10 --screenshot bands-gpu.png web/test/fixtures/bands.js | tee viewer-gpu.log
          grep -q '^GPU: ' viewer-gpu.log  # not the CPU fallback
          test -s bands-gpu.png
      - name: Viewer GPU smoke, 3.2 core profile (the macOS context setup)
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" ./build/tools/jsui-viewer/jsui-viewer --gpu --gl-core --width 320 --height 200 \
            --frames 10 --screenshot bands-gpu-core.png web/test/fixtures/bands.js | tee viewer-gpu-core.log
          grep -q '^GPU: .*Core Profile' viewer-gpu-core.log
          test -s bands-gpu-core.png
      - name: Viewer CPU smoke (--cpu; the GPU renderer is the default)
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          ./build/tools/jsui-viewer/jsui-viewer --cpu --width 320 --height 200 \
            --frames 10 --screenshot bands-cpu.png web/test/fixtures/bands.js | tee viewer-cpu.log
          ! grep -q '^GPU: ' viewer-cpu.log
          test -s bands-cpu.png
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-render-linux
          path: |
            build/jsui-render
            bands.png
            bands-gpu.png
            bands-gpu-core.png

  # ------------------------------------------------- Godot GDExtension (Linux)
  # Built against Skia m157 from source (scripts/build-skia-desktop.sh,
  # Graphite + Vulkan + header-only Dawn; cached on the hash of the script and
  # its Dawn patch) so JsuiView can render
  # straight into Godot's RenderingDevice textures. Godot runs headless
  # (CPU raster) and on Vulkan through Mesa's lavapipe under Xvfb (Skia
  # Graphite, checked against the CPU raster of the same frame, and what
  # Godot drew read back from the viewport and checked against that frame,
  # also with a separate render thread, where the animating frames of a
  # view and its surface views must go to that thread as one job per frame
  # without the main thread waiting).
  godot:
    name: godot (GDExtension, ubuntu)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'avrea-ubuntu-latest-4-vcpu' }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.godot == 'true'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang libfontconfig1-dev zlib1g-dev python3 unzip rsync \
            libvulkan1 mesa-vulkan-drivers vulkan-validationlayers xvfb xauth libegl1 libegl-mesa0 libgl1-mesa-dri \
            libgl-dev libegl-dev libgles-dev libx11-dev libvulkan-dev
      - name: Cache desktop Skia (m157, Graphite + Vulkan + Dawn headers)
        id: skia-desktop
        uses: actions/cache@v4
        with:
          path: third_party/skia-desktop
          key: skia-desktop-${{ runner.os }}-x64-${{ hashFiles('scripts/build-skia-desktop.sh', 'scripts/patches/skia-m157-dawn-header-only.patch') }}
      - name: Skia m157 for desktop (cache miss only, ~25 min on 4 cores)
        if: steps.skia-desktop.outputs.cache-hit != 'true'
        run: JOBS=$(nproc) scripts/build-skia-desktop.sh
      - name: Cache FetchContent sources + Godot
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/godot
          key: godot-deps-m157-4.7.2-cpp10-${{ runner.os }}-${{ hashFiles('cmake/*.cmake', 'integrations/godot/CMakeLists.txt', 'integrations/godot/smoke-test.sh') }}
          restore-keys: godot-deps-m157-4.7.2-cpp10-${{ runner.os }}-
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: godot-${{ runner.os }}
          max-size: 500M
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DJSUI_SKIA_DIR=third_party/skia-desktop -DJSUI_VULKAN=ON -DJSUI_GRAPHITE_DAWN=ON
          -DJSUI_BUILD_TESTS=ON -DJSUI_BUILD_VIEWER=OFF -DJSUI_BUILD_GODOT=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build GDExtension + native tests
        run: cmake --build build -j "$(nproc)" --target jsui_godot jsui-tests
      - name: Native tests against Skia m157 (incl. Graphite on Vulkan / lavapipe)
        # vulkan_test renders through jsui_gpu_create_vulkan on its own
        # lavapipe device and compares with the CPU raster; require it.
        env:
          JSUI_VULKAN_TEST_REQUIRE: 1
        run: ./build/jsui-tests
      - name: Demo bundle
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npx jsui build integrations/godot/demo/ui/app.jsx -o integrations/godot/demo/ui/dist/bundle.js
      - name: Run the demo in Godot 4.7.2 (headless, input self-test at 1x and 2x) and capture frames
        run: integrations/godot/smoke-test.sh build/godot-smoke.png
      - name: Run it in Godot 4.3 too (compatibility_minimum)
        run: GODOT_VERSION=4.3-stable integrations/godot/smoke-test.sh build/godot-smoke-4.3.png
      - name: Backend choice with a stand-in godot-aw3 WebGPUInterop of another Dawn revision (one warning, CPU)
        run: |
          FAKE_WEBGPU_INTEROP=0000000000000000000000000000000000000000 EXPECT_LOG="Dawn revision mismatch" SIZES=1280x720 \
            integrations/godot/smoke-test.sh build/godot-interop-mismatch.png
      - name: Run it on Vulkan (Forward+, lavapipe) - Skia Graphite into the RenderingDevice texture, compared with the CPU raster
        # Under the Khronos validation layer with synchronization validation:
        # any error (a hazard between JSUI's GPU work and Godot's frame on the
        # textures they share, an invalid view of them, ...) fails the step.
        run: |
          rm -f build/godot-pipelines.vulkan.bin
          VK_VALIDATION=sync GODOT_RENDERING=vulkan SIZES=1280x720 PIPELINE_CACHE=build/godot-pipelines.bin xvfb-run -a -s "-screen 0 1920x1080x24" \
            integrations/godot/smoke-test.sh build/godot-vulkan.png
      - name: Pipeline cache - record the list's first scroll into the same cache (UI clock at 60 fps)
        # What the check below replays. The pipelines a frame needs depend on
        # the frame rate (what the raster cache and opacity layers hold in
        # which frame), and the self-test's are not the first scroll's: on
        # a fixed 60 fps UI clock (JsuiView.fixed_fps) both runs draw the
        # same frames however fast this runner is. Prints what it compiled.
        run: |
          JSUI_LOG_PIPELINES=compiled VK_VALIDATION=sync GODOT_RENDERING=vulkan SIZES=1280x720 PIPELINE_CACHE=build/godot-pipelines.bin FIRST_SCROLL=1 FIXED_FPS=60 \
            xvfb-run -a -s "-screen 0 1920x1080x24" integrations/godot/smoke-test.sh
      - name: Pipeline cache - a warm Vulkan run precompiles what the two above recorded; the list's first scroll compiles nothing
        # Under sync validation too: the pipelines are created on a worker
        # thread while Godot renders. A failure names the pipelines.
        run: |
          JSUI_LOG_PIPELINES=compiled VK_VALIDATION=sync GODOT_RENDERING=vulkan SIZES=1280x720 PIPELINE_CACHE=build/godot-pipelines.bin FIRST_SCROLL=1 FIXED_FPS=60 EXPECT_WARM_PIPELINES=1 \
            xvfb-run -a -s "-screen 0 1920x1080x24" integrations/godot/smoke-test.sh
      - name: Vulkan with a separate render thread (--render-thread separate, as some games run it) - Godot must show the JSUI frame, and animating frames must not wait on the render thread
        # Under synchronization validation too: here JSUI's frames reach the
        # render thread as queued jobs, without the main thread waiting.
        run: |
          VK_VALIDATION=sync GODOT_RENDERING=vulkan GODOT_RENDER_THREAD=separate SIZES=1280x720 xvfb-run -a -s "-screen 0 1920x1080x24" \
            integrations/godot/smoke-test.sh build/godot-vulkan-separate.png
      - name: Vulkan in Godot 4.3 too
        run: |
          GODOT_VERSION=4.3-stable GODOT_RENDERING=vulkan SIZES=1280x720 xvfb-run -a -s "-screen 0 1920x1080x24" \
            integrations/godot/smoke-test.sh build/godot-vulkan-4.3.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jsui-godot-linux
          path: |
            integrations/godot/demo/bin/
            build/godot-smoke*.png
            build/godot-vulkan*.png
          if-no-files-found: warn

  # --------------------------------------- Godot GDExtension (macOS), advisory
  # Compile check of the Metal path: Skia m157 for macOS (Graphite + Metal + Dawn,
  # cached on the script's hash), then the GDExtension and the native tests.
  # Godot itself is not run here (no Metal RenderingDevice on hosted
  # runners): the Metal renderer needs a run on a real Mac.
  godot-macos:
    name: godot (GDExtension, macOS, Metal build)
    runs-on: macos-15
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.godot == 'true'
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Cache desktop Skia (m157, Graphite + Metal + Dawn headers)
        id: skia-desktop
        uses: actions/cache@v4
        with:
          path: third_party/skia-desktop
          key: skia-desktop-${{ runner.os }}-arm64-${{ hashFiles('scripts/build-skia-desktop.sh', 'scripts/patches/skia-m157-dawn-header-only.patch') }}
      - name: Tools
        run: command -v ninja || brew install ninja
      - name: Skia m157 for macOS (cache miss only)
        if: steps.skia-desktop.outputs.cache-hit != 'true'
        run: JOBS=$(sysctl -n hw.ncpu) scripts/build-skia-desktop.sh
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DJSUI_SKIA_DIR=third_party/skia-desktop -DJSUI_GRAPHITE_METAL=ON -DJSUI_GRAPHITE_DAWN=ON
          -DJSUI_BUILD_TESTS=ON -DJSUI_BUILD_VIEWER=OFF -DJSUI_BUILD_GODOT=ON
      - name: Build GDExtension + native tests
        run: cmake --build build -j "$(sysctl -n hw.ncpu)" --target jsui_godot jsui-tests
      - name: Native tests
        run: ./build/jsui-tests
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-godot-macos
          path: integrations/godot/demo/bin/

  # --------------------------------------------------------------------- wasm
  wasm:
    name: wasm (emscripten + browser)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'avrea-ubuntu-latest-4-vcpu' }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.wasm == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build rsync
      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: third_party/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('scripts/setup-emsdk.sh') }}
      - name: Cache Skia for WASM
        id: skia-wasm-cache
        uses: actions/cache@v4
        with:
          path: third_party/skia-wasm
          key: skia-wasm-${{ runner.os }}-${{ hashFiles('scripts/build-skia-wasm.sh', 'scripts/setup-emsdk.sh') }}
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build-wasm/_deps/*-src
          key: wasm-deps-${{ hashFiles('cmake/*.cmake') }}
      - name: emsdk
        run: scripts/setup-emsdk.sh
      - name: Skia for WASM (cache miss only, ~30 min)
        if: steps.skia-wasm-cache.outputs.cache-hit != 'true'
        run: JOBS=$(nproc) scripts/build-skia-wasm.sh
      - name: Build jsui.wasm
        run: JOBS=$(nproc) scripts/build-wasm.sh Release
      - name: Node smoke test
        run: node web/test/node-smoke.mjs
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json', 'web/package.json') }}
      - name: Browser tests (Playwright / Chromium)
        working-directory: web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install chromium
          JSUI_WEB_STRICT=1 npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-wasm
          path: web/dist

  # ------------------------------------------------------- wasm, GPU variant
  # Skia with Ganesh + WebGL (WEBGL=1): its own Skia cache key and output dir
  # (web/dist-webgl), so the CPU wasm job above is unaffected. The browser
  # tests run against the GPU module (renderer 'gpu' tests draw through Skia
  # on SwiftShader WebGL and compare with the CPU path).
  wasm-webgl:
    name: wasm webgl (emscripten + browser, GPU)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'avrea-ubuntu-latest-4-vcpu' }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.wasm == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build rsync
      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: third_party/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('scripts/setup-emsdk.sh') }}
      - name: Cache Skia for WASM (WebGL)
        id: skia-wasm-webgl-cache
        uses: actions/cache@v4
        with:
          path: third_party/skia-wasm-webgl
          key: skia-wasm-webgl-${{ runner.os }}-${{ hashFiles('scripts/build-skia-wasm.sh', 'scripts/setup-emsdk.sh') }}
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build-wasm-webgl/_deps/*-src
          key: wasm-webgl-deps-${{ hashFiles('cmake/*.cmake') }}
      - name: emsdk
        run: scripts/setup-emsdk.sh
      - name: Skia for WASM + WebGL (cache miss only, ~40 min)
        if: steps.skia-wasm-webgl-cache.outputs.cache-hit != 'true'
        run: WEBGL=1 JOBS=$(nproc) scripts/build-skia-wasm.sh
      - name: Build jsui.wasm (GPU)
        run: WEBGL=1 JOBS=$(nproc) scripts/build-wasm.sh Release
      - name: Node smoke test (GPU module, CPU path)
        run: JSUI_WEB_DIST=dist-webgl node web/test/node-smoke.mjs
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json', 'web/package.json') }}
      - name: Browser tests against the GPU module (Playwright / Chromium)
        working-directory: web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install chromium
          JSUI_WEB_STRICT=1 JSUI_WEB_DIST=dist-webgl npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-wasm-webgl
          path: web/dist-webgl
      # The showcase site (site/, deployed by pages.yml) runs on this module
      # with the GPU renderer: build it and open every route in Chromium (no
      # runtime errors, nothing blank).
      - name: Site (build + smoke test, GPU module)
        run: |
          npm ci --no-audit --no-fund
          node site/scripts/build.mjs --wasm web/dist-webgl --wasm-webgl web/dist-webgl
          node site/test/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-screenshots
          path: site/test/output
          if-no-files-found: ignore

  # ---------------------------------------------- wasm, WebGPU variant, advisory
  # Skia chrome/m157 with Graphite (Dawn backend on Emdawnwebgpu) + Ganesh
  # WebGL + CPU in one module (GPU=1 -> web/dist-gpu), built with its own
  # emsdk (6.0.13). Headless Chromium gets WebGPU from --enable-unsafe-webgpu
  # (a SwiftShader fallback adapter). Advisory while Graphite-on-wasm is new:
  # the Skia patch tracks an API Skia does not support upstream yet.
  wasm-webgpu:
    name: wasm webgpu (emscripten + browser, Graphite, advisory)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'avrea-ubuntu-latest-4-vcpu' }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.wasm == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build rsync
      - name: Cache Skia for WASM (Graphite) + its emsdk and Emdawnwebgpu
        uses: actions/cache@v4
        with:
          path: |
            third_party/skia-wasm-gpu
            third_party/emsdk-6.0.13
            third_party/emdawnwebgpu
          key: skia-wasm-gpu-${{ runner.os }}-${{ hashFiles('scripts/build-skia-wasm-graphite.sh', 'scripts/setup-emsdk.sh', 'scripts/setup-emdawnwebgpu.sh', 'scripts/patches/skia-m157-emdawnwebgpu.patch') }}
      - name: Build jsui.wasm (WebGPU + WebGL + CPU; builds Skia on a cache miss)
        run: GPU=1 JOBS=$(nproc) scripts/build-wasm.sh Release
      - name: Node smoke test (WebGPU module, CPU path)
        run: JSUI_WEB_DIST=dist-gpu node web/test/node-smoke.mjs
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json', 'web/package.json') }}
      - name: Browser tests against the WebGPU module (Playwright / Chromium)
        working-directory: web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install chromium
          JSUI_WEB_STRICT=1 JSUI_WEB_DIST=dist-gpu npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-wasm-gpu
          path: web/dist-gpu
      - name: Site (build + smoke test on WebGPU)
        run: |
          npm ci --no-audit --no-fund
          node site/scripts/build.mjs --wasm web/dist-gpu --wasm-webgl web/dist-gpu --wasm-gpu web/dist-gpu
          SITE_WEBGPU=1 SITE_EXPECT_RENDERER=webgpu node site/test/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-screenshots-webgpu
          path: site/test/output
          if-no-files-found: ignore

  # ----------------------------------------------------------------------- js
  js:
    name: js packages
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'avrea-ubuntu-latest-4-vcpu' }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.js == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Tests (packages/*)
        run: npm run test:js
      # The packed tarballs, installed outside the monorepo, must bundle an app
      # (catches a file missing from "files" or a workspace-only resolution).
      - name: Packed packages (install + build outside the workspace)
        run: |
          tgz="$RUNNER_TEMP/tgz" app="$RUNNER_TEMP/app"
          mkdir -p "$tgz" "$app"
          npm pack --workspace packages/react --workspace packages/cli --pack-destination "$tgz"
          cd "$app"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$tgz"/*.tgz
          printf '%s\n' "import { AppRegistry, View, Text } from 'react-native';" \
            "AppRegistry.registerComponent('main', () => () => <View><Text>Hello</Text></View>);" > app.jsx
          npx jsui build app.jsx -o out/bundle.js
          test -s out/bundle.js

  # ---------------------------------------------------------------- reference
  reference:
    name: reference (jsui vs react-native-web)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'avrea-ubuntu-latest-4-vcpu' }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.reference == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang libfontconfig1-dev zlib1g-dev
      - name: Cache prebuilt Skia + FetchContent sources
        uses: actions/cache@v4
        with:
          path: |
            third_party/skia-prebuilt
            build/_deps/*-src
          key: native-deps-${{ runner.os }}-${{ hashFiles('cmake/*.cmake', 'tools/**/CMakeLists.txt') }}
          restore-keys: native-deps-${{ runner.os }}-
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: reference-${{ runner.os }}
          max-size: 500M
      - name: Build jsui-render
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DJSUI_BUILD_TESTS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j "$(nproc)" --target jsui-render
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json', 'web/package.json') }}
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Reference tests
        run: npm run test:reference
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-report
          path: tests/reference/output
          if-no-files-found: warn

  # --------------------------------------------------- reference (macOS), advisory
  # Same suite against Chrome on macOS (CoreText text on both sides). Only
  # jsui-render is built; Skia and FetchContent sources are cached.
  reference-macos:
    name: reference (macOS, jsui vs react-native-web)
    runs-on: macos-14
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.reference == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache prebuilt Skia
        uses: actions/cache@v4
        with:
          path: third_party/skia-prebuilt
          key: skia-prebuilt-macos-14-${{ hashFiles('cmake/Deps.cmake') }}
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build/_deps/*-src
          key: reference-macos-deps-${{ hashFiles('cmake/*.cmake') }}
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: reference-${{ runner.os }}
          max-size: 500M
      - name: Build jsui-render
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJSUI_BUILD_TESTS=OFF -DJSUI_BUILD_VIEWER=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j "$(sysctl -n hw.ncpu)" --target jsui-render
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json', 'web/package.json') }}
      - name: Chromium
        run: npx playwright install chromium
      - name: Reference tests
        run: npm run test:reference
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-report-macos
          path: tests/reference/output
          if-no-files-found: warn

  # ------------------------------------------- native (macOS / Windows), advisory
  native-other:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.native == 'true'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Cache prebuilt Skia
        uses: actions/cache@v4
        with:
          path: third_party/skia-prebuilt
          key: skia-prebuilt-${{ matrix.os }}-${{ hashFiles('cmake/Deps.cmake') }}
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T ClangCL -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Native tests (macOS)
        if: runner.os == 'macOS'
        # gpu_test makes a headless CGL 3.2 core context (Apple's software
        # renderer if there is no GPU); require it so GPU cases cannot SKIP.
        env:
          JSUI_GPU_TEST_REQUIRE: 1
        run: ./build/jsui-tests
      - name: Viewer GPU smoke (macOS, SDL + 3.2 core profile)
        if: runner.os == 'macOS'
        run: |
          ./build/tools/jsui-viewer/jsui-viewer --gpu --width 320 --height 200 \
            --frames 10 --screenshot bands-gpu.png web/test/fixtures/bands.js | tee viewer-gpu.log
          grep -q '^GPU: ' viewer-gpu.log  # not the CPU fallback
          test -s bands-gpu.png
      - name: Native tests (Windows)
        if: runner.os == 'Windows'
        run: ./build/Release/jsui-tests.exe

  # ------------------------------------------------- iOS (simulator), advisory
  # Compile-only: Skia for iOS (Ganesh on Metal) is built from source
  # (scripts/build-skia-ios.sh, long on a hosted runner) and cached on the
  # script's hash; then the JsuiDemo app is built for the arm64 simulator.
  ios:
    name: iOS (simulator build)
    runs-on: macos-15
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.ios == 'true'
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache iOS Skia
        id: skia
        uses: actions/cache@v4
        with:
          path: third_party/skia-ios
          key: skia-ios-${{ hashFiles('scripts/build-skia-ios.sh') }}
      - name: Tools
        run: command -v ninja || brew install ninja
      - name: Skia (iphonesimulator-arm64)
        if: steps.skia.outputs.cache-hit != 'true'
        run: SLICES=iphonesimulator-arm64 scripts/build-skia-ios.sh
      - name: Install
        run: npm ci
      - name: Build JsuiDemo.app
        run: scripts/build-ios.sh
      - name: Check the app bundle
        run: |
          test -x build-ios-sim/integrations/ios/JsuiDemo.app/JsuiDemo
          test -s build-ios-sim/integrations/ios/JsuiDemo.app/ui/bundle.js
