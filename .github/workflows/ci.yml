name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  # ------------------------------------------------------------------ changes
  # Pull requests only run the jobs whose inputs changed (pushes to main and
  # manual runs build everything). CI config changes run everything.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    # paths-filter lists the PR's files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.filter.outputs.native }}
      wasm: ${{ steps.filter.outputs.wasm }}
      godot: ${{ steps.filter.outputs.godot }}
      js: ${{ steps.filter.outputs.js }}
      reference: ${{ steps.filter.outputs.reference }}
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
      engines: ${{ steps.filter.outputs.engines }}
      bindings: ${{ steps.filter.outputs.bindings }}
      dist: ${{ steps.filter.outputs.dist }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core: &core
              - 'src/**'
              - 'include/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'assets/**'
              - 'third_party/quickjs-*/**'
              - '.github/workflows/**'
            native:
              - *core
              - 'tools/**'
              - 'tests/native/**'
              - 'web/test/fixtures/**'
            wasm:
              - *core
              - 'scripts/**'
              - 'web/**'
              - 'site/**'
              - 'packages/cli/**'
              - 'packages/react/src/inspect.js'
            godot:
              - *core
              - 'integrations/godot/**'
              - 'scripts/build-godot-web.sh'
              - 'scripts/build-skia-wasm-mt.sh'
              - 'tools/wasm-localize/**'
              - 'integrations/sdl3/**'
              - 'integrations/shared/**'
              - 'integrations/unity/native/**'
              - 'integrations/unity/CMakeLists.txt'
              - 'scripts/build-skia-desktop.sh'
              - 'scripts/patches/skia-m157-dawn-header-only.patch'
              - 'tools/dawn-shim/**'
              - 'tests/native/**'
              - 'packages/**'
              - 'examples/showcase/**'
              - 'examples/theme.js'
              - 'examples/assets/**'
            js:
              - *core
              - 'packages/**'
              - 'web/jsui-*.js'
              - 'web/test/textures.test.mjs'
              - 'web/test/audio.test.mjs'
              - 'web/test/components.test.mjs'
              - 'tests/native/**'
              - 'package.json'
              - 'package-lock.json'
            engines:
              - *core
              - 'integrations/raylib/**'
              - 'integrations/sdl3/**'
              - 'integrations/sokol/**'
              - 'integrations/unity/**'
              - 'integrations/shared/**'
              - 'packages/**'
              - 'examples/theme.js'
            bindings:
              - *core
              - 'bindings/**'
              - 'packages/**'
              - 'examples/theme.js'
            # Release binaries: on pull requests only when the packaging or
            # the build changes (every push to main builds them).
            dist:
              - 'scripts/dist/**'
              - 'scripts/pgo-quickjs.sh'
              - 'tests/shared/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'include/**'
              - 'tools/jsui-viewer/**'
              - 'integrations/godot/CMakeLists.txt'
              - 'integrations/unity/CMakeLists.txt'
              - 'integrations/unity/native/**'
              - 'integrations/unity/package/**'
              - 'integrations/unreal/Plugins/**'
              - 'scripts/build-skia-desktop.sh'
              - 'scripts/build-skia-ios.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            ios:
              - *core
              - 'integrations/ios/**'
              - 'scripts/build-skia-ios.sh'
              - 'scripts/build-ios.sh'
            android:
              - *core
              - 'integrations/android/**'
              - 'scripts/build-skia-android.sh'
              - 'scripts/build-android.sh'
            reference:
              - *core
              - 'tools/jsui-render/**'
              - 'packages/**'
              - 'examples/**'
              - 'tests/reference/**'
              - 'package-lock.json'

  # ------------------------------------------------------------ native (Linux)
  native:
    name: native (ubuntu, clang)
    runs-on: ubuntu-24.04
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.native == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang libfontconfig1-dev zlib1g-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libgl1-mesa-dev \
            libegl1 libegl-mesa0 libgl1-mesa-dri xvfb xauth
      - name: Cache prebuilt Skia + FetchContent sources
        uses: actions/cache@v4
        with:
          path: |
            third_party/skia-prebuilt
            build/_deps/*-src
          key: native-deps-${{ runner.os }}-${{ hashFiles('cmake/*.cmake', 'tools/**/CMakeLists.txt') }}
          restore-keys: native-deps-${{ runner.os }}-
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native-${{ runner.os }}
          max-size: 500M
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j "$(nproc)"
      - name: Native tests
        # Mesa's surfaceless EGL (llvmpipe) gives the GPU tests a real GL
        # context; require it so a broken setup cannot silently SKIP them.
        env:
          JSUI_GPU_TEST_REQUIRE: 1
        run: ./build/jsui-tests
      - name: Render smoke
        run: ./build/jsui-render web/test/fixtures/bands.js -o bands.png --width 320 --height 200
      - name: Recorder smoke (jsui-record, fixed-clock timeline)
        run: |
          ./build/jsui-record web/test/fixtures/bands.js --timeline tools/jsui-record/smoke.json \
            --width 320 --height 200 --frames record-smoke/frames --stills record-smoke/stills
          test "$(ls record-smoke/frames | wc -l)" -eq 84
          test -s record-smoke/stills/click.png && test -s record-smoke/stills/pad.png
      - name: Viewer GPU smoke (Xvfb + Mesa GL)
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" ./build/tools/jsui-viewer/jsui-viewer --gpu --width 320 --height 200 \
            --frames 10 --screenshot bands-gpu.png web/test/fixtures/bands.js | tee viewer-gpu.log
          grep -q '^GPU: ' viewer-gpu.log  # not the CPU fallback
          test -s bands-gpu.png
      - name: Viewer GPU smoke, 3.2 core profile (the macOS context setup)
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" ./build/tools/jsui-viewer/jsui-viewer --gpu --gl-core --width 320 --height 200 \
            --frames 10 --screenshot bands-gpu-core.png web/test/fixtures/bands.js | tee viewer-gpu-core.log
          grep -q '^GPU: .*Core Profile' viewer-gpu-core.log
          test -s bands-gpu-core.png
      - name: Viewer CPU smoke (--cpu; the GPU renderer is the default)
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          ./build/tools/jsui-viewer/jsui-viewer --cpu --width 320 --height 200 \
            --frames 10 --screenshot bands-cpu.png web/test/fixtures/bands.js | tee viewer-cpu.log
          ! grep -q '^GPU: ' viewer-cpu.log
          test -s bands-cpu.png
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-render-linux
          path: |
            build/jsui-render
            bands.png
            bands-gpu.png
            bands-gpu-core.png

  # ---------------------------- JS thread under ThreadSanitizer (Linux)
  # The suites that run JS on its own thread (JsThread, the host-callback
  # queue, published host buffers) and the React e2e bundles (on the JS
  # thread, in lockstep and single-threaded; react_ui_thread_e2e: a second
  # thread ticking and recording frames, the main thread replaying them) in
  # a -fsanitize=thread build.
  # Timing checks are off under the sanitizer.
  native-tsan:
    name: native (ubuntu, clang, ThreadSanitizer)
    runs-on: ubuntu-24.04
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.native == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang libfontconfig1-dev zlib1g-dev
      - name: Cache prebuilt Skia + FetchContent sources
        uses: actions/cache@v4
        with:
          path: |
            third_party/skia-prebuilt
            build/_deps/*-src
          key: native-tsan-deps-${{ runner.os }}-${{ hashFiles('cmake/*.cmake', 'tools/**/CMakeLists.txt') }}
          restore-keys: native-tsan-deps-${{ runner.os }}-
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native-tsan-${{ runner.os }}
          max-size: 500M
      - name: Install workspace packages
        run: npm ci --no-audit --no-fund
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_C_FLAGS=-fsanitize=thread -DCMAKE_CXX_FLAGS=-fsanitize=thread
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread -DJSUI_BUILD_VIEWER=OFF -DJSUI_BUILD_TOOLS=OFF
      - name: Build
        run: cmake --build build -j "$(nproc)" --target jsui-tests
      - name: Threaded native tests
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
        run: ./build/jsui-tests js_thread host_queue host_buffers
      - name: React e2e (JS thread, lockstep, single-threaded)
        working-directory: packages/cli
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
          JSUI_TESTS: ${{ github.workspace }}/build/jsui-tests
        run: node --test test/e2e.test.js

  # ------------------------------------------- engine examples (Linux, Xvfb)
  # integrations/raylib, sdl3 and sokol: the shared HUD in three game loops.
  # Each runs its --selftest (an empty-space click passes through to the game,
  # a click on the Spawn button is consumed and its message reaches the game)
  # on the GPU path (Mesa llvmpipe GL) and on the CPU path, and saves the
  # composed frame.
  engines:
    name: engine examples (raylib, SDL3, sokol, Unity plugin)
    runs-on: ubuntu-24.04
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.engines == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang libfontconfig1-dev zlib1g-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxinerama-dev libxfixes-dev \
            libgl1-mesa-dev libegl1 libegl-mesa0 libgl1-mesa-dri xvfb xauth
      - name: Cache prebuilt Skia + engine sources
        uses: actions/cache@v4
        with:
          path: |
            third_party/skia-prebuilt
            build/_deps/*-src
          key: engines-deps-${{ runner.os }}-${{ hashFiles('cmake/*.cmake', 'integrations/*/CMakeLists.txt', 'integrations/shared/fetch.cmake') }}
          restore-keys: engines-deps-${{ runner.os }}-
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: engines-${{ runner.os }}
          max-size: 500M
      - name: UI bundle
        run: |
          npm ci
          npx jsui build integrations/shared/ui/app.jsx -o integrations/shared/ui/dist/bundle.js
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DJSUI_BUILD_TESTS=OFF -DJSUI_BUILD_VIEWER=OFF
          -DJSUI_BUILD_RAYLIB=ON -DJSUI_BUILD_SDL3=ON -DJSUI_BUILD_SOKOL=ON -DJSUI_BUILD_UNITY=ON
      - name: Build
        run: cmake --build build -j "$(nproc)" --target jsui-raylib jsui-sdl3 jsui-sokol jsui_unity
      - name: Unity plugin smoke (its C exports through ctypes; Unity itself needs a license) - JS thread on (one stall frame) and off
        run: |
          python3 integrations/unity/native/smoke.py integrations/unity/package/Plugins/Linux/x86_64/libjsui_unity.so integrations/shared/ui/dist/bundle.js on
          python3 integrations/unity/native/smoke.py integrations/unity/package/Plugins/Linux/x86_64/libjsui_unity.so integrations/shared/ui/dist/bundle.js off
      - name: Self-tests and frames
        run: |
          mkdir -p engines
          x() { xvfb-run -a -s "-screen 0 1600x1000x24" "$@"; }
          # JS on its own thread (the default): the selftest's JS stall must not hold a frame.
          x ./build/jsui-raylib --selftest --screenshot engines/raylib.png | tee engines/raylib.log
          grep -q '^GPU: ' engines/raylib.log && grep -q 'selftest: ok' engines/raylib.log
          grep -q '^JS thread: on' engines/raylib.log && grep -q 'selftest: JS thread on: ' engines/raylib.log
          # ... and on the game's thread (--js-thread off): the stall holds it.
          x ./build/jsui-raylib --js-thread off --selftest | tee engines/raylib-js-off.log
          grep -q 'selftest: JS thread off: ' engines/raylib-js-off.log && grep -q 'selftest: ok' engines/raylib-js-off.log
          x ./build/jsui-raylib --cpu --selftest --screenshot engines/raylib-cpu.png | tee engines/raylib-cpu.log
          ! grep -q '^GPU: ' engines/raylib-cpu.log && grep -q 'selftest: ok' engines/raylib-cpu.log
          x ./build/jsui-sokol --selftest --screenshot engines/sokol.png | tee engines/sokol.log
          grep -q '^GPU: ' engines/sokol.log && grep -q 'selftest: ok' engines/sokol.log
          x ./build/jsui-sokol --cpu --selftest --screenshot engines/sokol-cpu.png | tee engines/sokol-cpu.log
          grep -q 'selftest: ok' engines/sokol-cpu.log
          # Prebuilt Skia (Ganesh GL, no Graphite): SDL's opengl renderer, Skia into its texture.
          x ./build/jsui-sdl3 --selftest --screenshot engines/sdl3.png | tee engines/sdl3.log
          grep -q '^GPU: Skia Ganesh GL' engines/sdl3.log && grep -q 'selftest: ok' engines/sdl3.log
          x ./build/jsui-sdl3 --cpu --selftest --screenshot engines/sdl3-cpu.png | tee engines/sdl3-cpu.log
          ! grep -q '^GPU: ' engines/sdl3-cpu.log && grep -q 'selftest: ok' engines/sdl3-cpu.log
          SDL_VIDEO_DRIVER=dummy ./build/jsui-sdl3 --renderer software --selftest --screenshot engines/sdl3-software.png | tee engines/sdl3-software.log
          grep -q 'selftest: ok' engines/sdl3-software.log
          for f in engines/*.png; do test -s "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-examples-linux
          path: engines/

  # ------------------------------------------------- Rust and Go bindings
  # libjsui (jsui_shared, prebuilt Skia m124: Ganesh GL) linked from the Rust
  # crate and the Go package: their tests, then each quest-log example's
  # self-test on Mesa's GL under Xvfb.
  bindings:
    name: bindings (Rust, Go)
    runs-on: ubuntu-24.04
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.bindings == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: bindings/go/examples/quests/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/rust
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang cmake libfontconfig1-dev zlib1g-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxfixes-dev libxxf86vm-dev \
            libgl1-mesa-dev libegl1 libegl-mesa0 libgl1-mesa-dri xvfb xauth
      - name: Cache prebuilt Skia
        uses: actions/cache@v4
        with:
          path: third_party/skia-prebuilt
          key: bindings-skia-${{ runner.os }}-${{ hashFiles('cmake/*.cmake') }}
          restore-keys: bindings-skia-${{ runner.os }}-
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: bindings-${{ runner.os }}
          max-size: 500M
      - name: UI bundle
        run: |
          npm ci
          npx jsui build bindings/ui/app.jsx -o bindings/ui/dist/bundle.js
      - name: libjsui
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DJSUI_BUILD_SHARED=ON -DJSUI_BUILD_TESTS=OFF -DJSUI_BUILD_VIEWER=OFF -DJSUI_BUILD_TOOLS=OFF
          cmake --build build -j "$(nproc)" --target jsui_shared
      - name: The Go module's copy of jsui.h is current
        run: cmp include/jsui/jsui.h bindings/go/include/jsui/jsui.h
      - name: Rust
        working-directory: bindings/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release --example quests
      - name: Go
        working-directory: bindings/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          cd examples/quests && go vet ./... && go build -o ../../../../build/quests-go .
      - name: Self-tests and frames
        run: |
          mkdir -p bindings-out
          x() { xvfb-run -a -s "-screen 0 1600x1000x24" "$@"; }
          x bindings/rust/target/release/examples/quests --selftest --screenshot bindings-out/rust.png | tee bindings-out/rust.log
          grep -q '^GPU: Skia Ganesh GL' bindings-out/rust.log && grep -q 'selftest: ok' bindings-out/rust.log
          grep -q '^JS thread: on' bindings-out/rust.log
          x build/quests-go --selftest --screenshot bindings-out/go.png | tee bindings-out/go.log
          grep -q '^GPU: Skia Ganesh GL' bindings-out/go.log && grep -q 'selftest: ok' bindings-out/go.log
          grep -q '^JS thread: on' bindings-out/go.log
          # The examples run JS on its own thread by default; once more with it off.
          x bindings/rust/target/release/examples/quests --js-thread off --selftest | tee bindings-out/rust-js-off.log
          grep -q '^JS thread: off' bindings-out/rust-js-off.log && grep -q 'selftest: ok' bindings-out/rust-js-off.log
          x build/quests-go --js-thread off --selftest | tee bindings-out/go-js-off.log
          grep -q '^JS thread: off' bindings-out/go-js-off.log && grep -q 'selftest: ok' bindings-out/go-js-off.log
          for f in bindings-out/*.png; do test -s "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bindings-linux
          path: bindings-out/

  # ------------------------------------------------- Godot GDExtension (Linux)
  # Built against Skia m157 from source (scripts/build-skia-desktop.sh,
  # Graphite + Vulkan + header-only Dawn; cached on the hash of the script and
  # its Dawn patch) so JsuiView can render
  # straight into Godot's RenderingDevice textures. Godot runs headless
  # (CPU raster) and on Vulkan through Mesa's lavapipe under Xvfb (Skia
  # Graphite, checked against the CPU raster of the same frame, and what
  # Godot drew read back from the viewport and checked against that frame,
  # also with a separate render thread, where the animating frames of a
  # view and its surface views must go to that thread as one job per frame
  # without the main thread waiting).
  godot:
    name: godot (GDExtension, ubuntu)
    runs-on: ubuntu-24.04
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.godot == 'true'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang libfontconfig1-dev zlib1g-dev python3 unzip rsync \
            libvulkan1 mesa-vulkan-drivers vulkan-validationlayers xvfb xauth libegl1 libegl-mesa0 libgl1-mesa-dri \
            libgl-dev libegl-dev libgles-dev libx11-dev libvulkan-dev \
            libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxinerama-dev libxfixes-dev
      - name: Cache desktop Skia (m157, Graphite + Vulkan + Dawn headers)
        id: skia-desktop
        uses: actions/cache@v4
        with:
          path: third_party/skia-desktop
          key: skia-desktop-${{ runner.os }}-x64-${{ hashFiles('scripts/build-skia-desktop.sh', 'scripts/patches/skia-m157-dawn-header-only.patch') }}
      - name: Skia m157 for desktop (cache miss only, ~25 min on 4 cores)
        if: steps.skia-desktop.outputs.cache-hit != 'true'
        run: JOBS=$(nproc) scripts/build-skia-desktop.sh
      - name: Cache FetchContent sources + Godot
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/godot
          key: godot-deps-m157-4.7.2-cpp10-${{ runner.os }}-${{ hashFiles('cmake/*.cmake', 'integrations/godot/CMakeLists.txt', 'integrations/godot/smoke-test.sh') }}
          restore-keys: godot-deps-m157-4.7.2-cpp10-${{ runner.os }}-
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: godot-${{ runner.os }}
          max-size: 500M
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DJSUI_SKIA_DIR=third_party/skia-desktop -DJSUI_VULKAN=ON -DJSUI_GRAPHITE_DAWN=ON
          -DJSUI_BUILD_TESTS=ON -DJSUI_BUILD_VIEWER=OFF -DJSUI_BUILD_GODOT=ON -DJSUI_BUILD_SDL3=ON
          -DJSUI_BUILD_UNITY=ON -DJSUI_UNITY_PLUGIN_DIR=$PWD/build/unity
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build GDExtension + native tests
        run: cmake --build build -j "$(nproc)" --target jsui_godot jsui-tests jsui-sdl3 jsui_unity jsui-unity-vulkan-test
      - name: Native tests against Skia m157 (incl. Graphite on Vulkan / lavapipe)
        # vulkan_test renders through jsui_gpu_create_vulkan on its own
        # lavapipe device and compares with the CPU raster; require it.
        env:
          JSUI_VULKAN_TEST_REQUIRE: 1
        run: ./build/jsui-tests
      - name: Unity plugin on Vulkan (lavapipe) without Unity - a stand-in for Unity's plugin API drives the GPU path, under sync validation
        # integrations/unity/native/test/unity_vulkan_test.cpp loads the
        # built plugin, plays Unity's part (IUnityGraphicsVulkanV2, a frame
        # recorded into command buffers submitted at its end, AccessQueue
        # callbacks run synchronously and from a submission thread) and
        # compares the frames with the CPU raster. Any validation error (a
        # layout Unity's tracking does not expect, a hazard between the
        # plugin's render and "Unity's" work on the texture) fails the step.
        env:
          JSUI_VULKAN_TEST_REQUIRE: 1
        run: |
          vkdir="$(mktemp -d)"
          printf '%s\n' \
            'khronos_validation.enables = VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT' \
            'khronos_validation.report_flags = error' \
            'khronos_validation.debug_action = VK_DBG_LAYER_ACTION_LOG_MSG' \
            "khronos_validation.log_filename = $vkdir/validation.log" \
            'khronos_validation.message_id_filter = VUID-vkGetPhysicalDeviceFormatProperties-format-parameter' \
            > "$vkdir/vk_layer_settings.txt"
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation VK_LAYER_SETTINGS_PATH="$vkdir" \
            ./build/integrations/unity/jsui-unity-vulkan-test build/integrations/unity/libjsui_unity.so
          if [ -s "$vkdir/validation.log" ]; then cat "$vkdir/validation.log"; exit 1; fi
      - name: Demo bundle
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npx jsui build integrations/godot/demo/ui/app.jsx -o integrations/godot/demo/ui/dist/bundle.js
      - name: SDL3 example on Vulkan (lavapipe) - Skia Graphite into the SDL_Texture's VkImage on SDL's queue, under sync validation
        # The engines job runs the GL and CPU paths with the prebuilt Skia;
        # this one has Graphite on Vulkan. Any validation error (a hazard
        # between JSUI's render and SDL's frames on the shared image, a
        # layout SDL does not expect) fails the step.
        run: |
          npx jsui build integrations/shared/ui/app.jsx -o integrations/shared/ui/dist/bundle.js
          vkdir="$(mktemp -d)"
          printf '%s\n' \
            'khronos_validation.enables = VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT' \
            'khronos_validation.report_flags = error' \
            'khronos_validation.debug_action = VK_DBG_LAYER_ACTION_LOG_MSG' \
            "khronos_validation.log_filename = $vkdir/validation.log" \
            'khronos_validation.message_id_filter = VUID-vkGetPhysicalDeviceFormatProperties-format-parameter' \
            > "$vkdir/vk_layer_settings.txt"
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation VK_LAYER_SETTINGS_PATH="$vkdir" xvfb-run -a -s "-screen 0 1600x1000x24" \
            ./build/jsui-sdl3 --selftest --screenshot build/sdl3-vulkan.png | tee build/sdl3-vulkan.log
          grep -q '^GPU: Skia Graphite Vulkan' build/sdl3-vulkan.log && grep -q 'selftest: ok' build/sdl3-vulkan.log
          if [ -s "$vkdir/validation.log" ]; then cat "$vkdir/validation.log"; exit 1; fi
      - name: Run the demo in Godot 4.7.2 (headless, input self-test at 1x and 2x) and capture frames
        run: integrations/godot/smoke-test.sh build/godot-smoke.png
      - name: Run it in Godot 4.3 too (compatibility_minimum)
        run: GODOT_VERSION=4.3-stable integrations/godot/smoke-test.sh build/godot-smoke-4.3.png
      - name: Run it with JS on the main thread (js_thread off; the other runs use the JS thread, the default)
        run: JS_THREAD=off SIZES=1280x720 integrations/godot/smoke-test.sh build/godot-smoke-js-off.png
      - name: Backend choice with a stand-in godot-aw3 WebGPUInterop of another Dawn revision (one warning, CPU)
        run: |
          FAKE_WEBGPU_INTEROP=0000000000000000000000000000000000000000 EXPECT_LOG="Dawn revision mismatch" SIZES=1280x720 \
            integrations/godot/smoke-test.sh build/godot-interop-mismatch.png
      - name: Run it on Vulkan (Forward+, lavapipe) - Skia Graphite into the RenderingDevice texture, compared with the CPU raster
        # Under the Khronos validation layer with synchronization validation:
        # any error (a hazard between JSUI's GPU work and Godot's frame on the
        # textures they share, an invalid view of them, ...) fails the step.
        run: |
          rm -f build/godot-pipelines.vulkan.bin
          VK_VALIDATION=sync GODOT_RENDERING=vulkan SIZES=1280x720 PIPELINE_CACHE=build/godot-pipelines.bin xvfb-run -a -s "-screen 0 1920x1080x24" \
            integrations/godot/smoke-test.sh build/godot-vulkan.png
      - name: Pipeline cache - record the list's first scroll into the same cache (UI clock at 60 fps)
        # What the check below replays. The pipelines a frame needs depend on
        # the frame rate (what the raster cache and opacity layers hold in
        # which frame), and the self-test's are not the first scroll's: on
        # a fixed 60 fps UI clock (JsuiView.fixed_fps) both runs draw the
        # same frames however fast this runner is. Prints what it compiled.
        run: |
          JSUI_LOG_PIPELINES=compiled VK_VALIDATION=sync GODOT_RENDERING=vulkan SIZES=1280x720 PIPELINE_CACHE=build/godot-pipelines.bin FIRST_SCROLL=1 FIXED_FPS=60 \
            xvfb-run -a -s "-screen 0 1920x1080x24" integrations/godot/smoke-test.sh
      - name: Pipeline cache - a warm Vulkan run precompiles what the two above recorded; the list's first scroll compiles nothing
        # Under sync validation too: the pipelines are created on a worker
        # thread while Godot renders. A failure names the pipelines.
        run: |
          JSUI_LOG_PIPELINES=compiled VK_VALIDATION=sync GODOT_RENDERING=vulkan SIZES=1280x720 PIPELINE_CACHE=build/godot-pipelines.bin FIRST_SCROLL=1 FIXED_FPS=60 EXPECT_WARM_PIPELINES=1 \
            xvfb-run -a -s "-screen 0 1920x1080x24" integrations/godot/smoke-test.sh
      - name: Vulkan with a separate render thread (--render-thread separate, as some games run it) - Godot must show the JSUI frame, and animating frames must not wait on the render thread
        # Under synchronization validation too: here JSUI's frames reach the
        # render thread as queued jobs, without the main thread waiting.
        run: |
          VK_VALIDATION=sync GODOT_RENDERING=vulkan GODOT_RENDER_THREAD=separate SIZES=1280x720 xvfb-run -a -s "-screen 0 1920x1080x24" \
            integrations/godot/smoke-test.sh build/godot-vulkan-separate.png
      - name: Vulkan with the UI thread (ui_thread lockstep and pipelined) - the tick and paint recorded on the runtime's thread, replayed into the texture on the main thread
        # Under synchronization validation too; the self-test's `ui thread`
        # check requires the frames to have gone through the UI thread.
        run: |
          for mode in lockstep pipelined; do
            VK_VALIDATION=sync GODOT_RENDERING=vulkan UI_THREAD=$mode SIZES=1280x720 xvfb-run -a -s "-screen 0 1920x1080x24" \
              integrations/godot/smoke-test.sh build/godot-vulkan-ui-$mode.png
          done
      - name: Vulkan in Godot 4.3 too
        run: |
          GODOT_VERSION=4.3-stable GODOT_RENDERING=vulkan SIZES=1280x720 xvfb-run -a -s "-screen 0 1920x1080x24" \
            integrations/godot/smoke-test.sh build/godot-vulkan-4.3.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jsui-godot-linux
          path: |
            integrations/godot/demo/bin/
            build/godot-smoke*.png
            build/godot-vulkan*.png
            build/sdl3-vulkan.png
          if-no-files-found: warn

  # --------------------------------------- Godot GDExtension (macOS), advisory
  # Compile check of the Metal path: Skia m157 for macOS (Graphite + Metal + Dawn,
  # cached on the script's hash), then the GDExtension and the native tests.
  # Godot itself is not run here (no Metal RenderingDevice on hosted
  # runners): the Metal renderer needs a run on a real Mac.
  godot-macos:
    name: godot (GDExtension, macOS, Metal build)
    runs-on: macos-15
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.godot == 'true'
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Cache desktop Skia (m157, Graphite + Metal + Dawn headers)
        id: skia-desktop
        uses: actions/cache@v4
        with:
          path: third_party/skia-desktop
          key: skia-desktop-${{ runner.os }}-arm64-${{ hashFiles('scripts/build-skia-desktop.sh', 'scripts/patches/skia-m157-dawn-header-only.patch') }}
      - name: Tools
        run: command -v ninja || brew install ninja
      - name: Skia m157 for macOS (cache miss only)
        if: steps.skia-desktop.outputs.cache-hit != 'true'
        run: JOBS=$(sysctl -n hw.ncpu) scripts/build-skia-desktop.sh
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DJSUI_SKIA_DIR=third_party/skia-desktop -DJSUI_GRAPHITE_METAL=ON -DJSUI_GRAPHITE_DAWN=ON
          -DJSUI_BUILD_TESTS=ON -DJSUI_BUILD_VIEWER=OFF -DJSUI_BUILD_GODOT=ON
      - name: Build GDExtension + native tests
        run: cmake --build build -j "$(sysctl -n hw.ncpu)" --target jsui_godot jsui-tests
      - name: Native tests
        run: ./build/jsui-tests
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-godot-macos
          path: integrations/godot/demo/bin/

  # ------------------------------------------------- Windows (Skia m157, GPU)
  # Skia m157 for Windows built from source (scripts/build-skia-desktop.sh:
  # Graphite + Vulkan, Ganesh + GL + Direct3D 12, clang-cl, /MT), cached on
  # the hash of the script and its patch. A cache hit only looks the key up;
  # the jobs below restore it.
  skia-windows:
    name: Skia m157 (windows-x64)
    runs-on: windows-2022
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.native == 'true' || needs.changes.outputs.godot == 'true' || needs.changes.outputs.dist == 'true'
    timeout-minutes: 240
    outputs:
      key: ${{ steps.key.outputs.key }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Cache key
        id: key
        run: echo "key=skia-desktop-${{ runner.os }}-x64-${{ hashFiles('scripts/build-skia-desktop.sh', 'scripts/patches/skia-m157-dawn-header-only.patch') }}" >> "$GITHUB_OUTPUT"
      - name: Cache desktop Skia (m157)
        id: skia
        uses: actions/cache@v4
        with:
          path: third_party/skia-desktop
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Skia m157 for Windows (cache miss only)
        if: steps.skia.outputs.cache-hit != 'true'
        run: |
          pip install ninja==1.13.0
          git config --global core.longpaths true
          JOBS=4 scripts/build-skia-desktop.sh
          rm -rf third_party/skia-src-m157  # not cached

  # Native tests on Windows against Skia m157, with the GPU backends required:
  # Graphite on Vulkan (Mesa lavapipe) and Ganesh on Direct3D 12 / 11 (WARP,
  # the runner has no GPU); each is compared with the CPU raster.
  windows:
    name: native (windows, Skia m157 + Vulkan / D3D12)
    runs-on: windows-2022
    needs: [changes, skia-windows]
    if: ${{ !cancelled() && needs.skia-windows.result == 'success' && (github.event_name != 'pull_request' || needs.changes.outputs.native == 'true' || needs.changes.outputs.godot == 'true') }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Desktop Skia m157 (built by skia-windows)
        uses: actions/cache/restore@v4
        with:
          path: third_party/skia-desktop
          key: ${{ needs.skia-windows.outputs.key }}
          fail-on-cache-miss: true
      - name: Vulkan loader + Mesa lavapipe
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.328.1
          install_runtime: true
          install_lavapipe: true
          cache: true
          stripdown: true
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build/_deps/*-src
          key: windows-deps-m157-${{ hashFiles('cmake/*.cmake', 'integrations/godot/CMakeLists.txt', 'tools/jsui-viewer/CMakeLists.txt') }}
          restore-keys: windows-deps-m157-
      - name: MSVC environment (Windows SDK, link libraries)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Ninja
        run: pip install ninja==1.13.0
      - name: sccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: windows-native
          max-size: 1G
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_C_COMPILER=C:/Program Files/LLVM/bin/clang-cl.exe" "-DCMAKE_CXX_COMPILER=C:/Program Files/LLVM/bin/clang-cl.exe"
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DJSUI_SKIA_DIR=third_party/skia-desktop
          -DJSUI_BUILD_TESTS=ON -DJSUI_BUILD_GODOT=ON
          "-DCMAKE_CXX_FLAGS_RELEASE=-O2 -Ob2 -DNDEBUG -Z7" "-DCMAKE_EXE_LINKER_FLAGS_RELEASE=-DEBUG"
      - name: Build
        run: cmake --build build -j 4 --target jsui-tests jsui-viewer jsui_godot
      - name: Native tests (GPU backends required)
        env:
          JSUI_VULKAN_TEST_REQUIRE: 1
          JSUI_D3D_TEST_REQUIRE: 1
        run: |
          # The loader (vulkan-1.dll) and lavapipe's ICD, wherever the action put them.
          sdk="$(cygpath -u "$VULKAN_SDK")"
          loader="$( (find "$sdk" /c/Windows/System32 -maxdepth 3 -iname vulkan-1.dll 2>/dev/null || true) | head -1)"
          icd="$( (find /c/lavapipe "$sdk" -iname 'lvp_icd*.json' 2>/dev/null || true) | head -1)"
          echo "loader: $loader, lavapipe ICD: $icd"
          [ -n "$loader" ] && [ -n "$icd" ]
          export PATH="$(dirname "$loader"):$sdk/Bin:$PATH"
          export VK_DRIVER_FILES="$(cygpath -w "$icd")"
          vulkaninfo --summary 2>&1 | head -40 || true
          ./build/jsui-tests.exe

  # ---------------------------------------------------- release binaries (dist)
  # The prebuilt native binaries every release attaches (release.yml takes
  # these artifacts from the CI run on main for the tagged commit, as it
  # does the WASM modules): per platform the shared C API library (jsui_shared)
  # with its header and CMake package, the viewer, the Godot GDExtension
  # library and the Unity plugin, staged by scripts/dist/stage-native.sh into
  # jsui-native-<platform>; the shared library and the Unity plugin also on
  # their own (jsui-shared-*, jsui-unity-*) for the engine plugin packaging.
  # Each package is checked like a host would use it
  # (scripts/dist/check-shared.sh). Desktop Skia m157 on Linux and macOS
  # (Graphite on Vulkan / Metal), and on Windows (Graphite on Vulkan, Ganesh
  # on Direct3D 12 / GL; skia-windows).
  dist-linux:
    name: dist (linux-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.dist == 'true'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4  # the PGO training bundles (jsui CLI)
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: System packages
        # llvm, libclang-rt-dev: llvm-profdata and the profile runtime for QuickJS PGO.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang llvm libclang-rt-dev libfontconfig1-dev zlib1g-dev python3 unzip rsync \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxinerama-dev libxfixes-dev \
            libgl-dev libegl-dev libgl1-mesa-dev libegl1 libegl-mesa0 libgl1-mesa-dri xvfb xauth
      - name: Cache desktop Skia (m157)
        id: skia-desktop
        uses: actions/cache@v4
        with:
          path: third_party/skia-desktop
          # Same key as the godot job on x64.
          key: skia-desktop-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/build-skia-desktop.sh', 'scripts/patches/skia-m157-dawn-header-only.patch') }}
      - name: Skia m157 for desktop (cache miss only)
        if: steps.skia-desktop.outputs.cache-hit != 'true'
        run: JOBS=$(nproc) scripts/build-skia-desktop.sh
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build/_deps/*-src
          key: dist-deps-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('cmake/*.cmake', 'integrations/godot/CMakeLists.txt', 'tools/jsui-viewer/CMakeLists.txt') }}
          restore-keys: dist-deps-${{ runner.os }}-${{ matrix.arch }}-
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: dist-${{ runner.os }}-${{ matrix.arch }}
          max-size: 500M
      - name: Configure, with QuickJS PGO (instrumented build, training, profile; falls back to no PGO with a warning)
        run: >
          scripts/pgo-quickjs.sh build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DJSUI_SKIA_DIR=third_party/skia-desktop -DJSUI_BUILD_SHARED=ON -DJSUI_BUILD_TESTS=OFF
          -DJSUI_BUILD_GODOT=ON -DJSUI_GODOT_OUTPUT_DIR=$PWD/build/godot
          -DJSUI_BUILD_UNITY=ON -DJSUI_UNITY_PLUGIN_DIR=$PWD/build/unity
      - name: Build
        run: cmake --build build -j "$(nproc)" --target jsui_shared jsui-viewer jsui_godot jsui_unity
      - name: Stage
        run: scripts/dist/stage-native.sh linux-${{ matrix.arch }} dist build
      - name: Check the shared library (a host build against the package)
        run: scripts/dist/check-shared.sh dist/shared
      - name: Viewer smoke (the staged binary, Xvfb + Mesa GL)
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" dist/viewer/jsui-viewer --width 320 --height 200 \
            --frames 10 --screenshot viewer.png web/test/fixtures/bands.js | tee viewer.log
          grep -q '^GPU: ' viewer.log
          test -s viewer.png
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-native-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-shared-linux-${{ matrix.arch }}
          path: dist/shared/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-unity-linux-${{ matrix.arch }}
          path: dist/unity/
          if-no-files-found: error

  dist-macos:
    name: dist (macos-universal)
    runs-on: macos-15
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.dist == 'true'
    timeout-minutes: 180
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - name: Cache desktop Skia (m157, arm64)
        id: skia-arm64
        uses: actions/cache@v4
        with:
          path: third_party/skia-desktop
          # Same key as the godot-macos job.
          key: skia-desktop-${{ runner.os }}-arm64-${{ hashFiles('scripts/build-skia-desktop.sh', 'scripts/patches/skia-m157-dawn-header-only.patch') }}
      - name: Cache desktop Skia (m157, x86_64)
        id: skia-x64
        uses: actions/cache@v4
        with:
          path: third_party/skia-desktop-x64
          key: skia-desktop-${{ runner.os }}-x64-${{ hashFiles('scripts/build-skia-desktop.sh', 'scripts/patches/skia-m157-dawn-header-only.patch') }}
      - uses: actions/setup-node@v4  # the PGO training bundles (jsui CLI)
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Tools
        run: command -v ninja || brew install ninja
      - name: Skia m157 for macOS arm64 (cache miss only)
        if: steps.skia-arm64.outputs.cache-hit != 'true'
        run: JOBS=$(sysctl -n hw.ncpu) scripts/build-skia-desktop.sh
      - name: Skia m157 for macOS x86_64 (cache miss only, cross-compiled)
        if: steps.skia-x64.outputs.cache-hit != 'true'
        run: SKIA_CPU=x64 SKIA_DESKTOP_OUT=$PWD/third_party/skia-desktop-x64 JOBS=$(sysctl -n hw.ncpu) scripts/build-skia-desktop.sh
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: |
            build-arm64/_deps/*-src
            build-x64/_deps/*-src
          key: dist-deps-${{ runner.os }}-${{ hashFiles('cmake/*.cmake', 'integrations/godot/CMakeLists.txt', 'tools/jsui-viewer/CMakeLists.txt') }}
          restore-keys: dist-deps-${{ runner.os }}-
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: dist-${{ runner.os }}
          max-size: 1G
      # QuickJS PGO: scripts/pgo-quickjs.sh trains the arm64 build on this
      # (arm64) runner; the x86_64 slice uses the same profile (Clang's
      # profiles are per source function, not per CPU). Without a profile
      # both build without PGO, with a warning.
      - name: Configure and build (arm64, x86_64)
        run: |
          for arch in arm64 x64; do
            if [ $arch = arm64 ]; then osx=arm64; skia=$PWD/third_party/skia-desktop; else osx=x86_64; skia=$PWD/third_party/skia-desktop-x64; fi
            if [ $arch = arm64 ]; then
              configure="scripts/pgo-quickjs.sh build-$arch"
            else
              configure="cmake -S . -B build-$arch -DJSUI_QUICKJS_PGO=use -DJSUI_QUICKJS_PROFILE=$PWD/build-arm64/pgo/quickjs.profdata"
            fi
            $configure -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=$osx \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DJSUI_SKIA_DIR=$skia -DJSUI_SKIA_LIB_DIR=$skia/out/macos-$arch \
              -DJSUI_BUILD_SHARED=ON -DJSUI_BUILD_TESTS=OFF \
              -DJSUI_BUILD_GODOT=ON -DJSUI_GODOT_OUTPUT_DIR=$PWD/build-$arch/godot \
              -DJSUI_BUILD_UNITY=ON -DJSUI_UNITY_PLUGIN_DIR=$PWD/build-$arch/unity
            grep -q 'JSUI_GRAPHITE_METAL:BOOL=ON' build-$arch/CMakeCache.txt
            cmake --build build-$arch -j "$(sysctl -n hw.ncpu)" --target jsui_shared jsui-viewer jsui_godot jsui_unity
          done
      - name: Stage (universal binaries)
        run: scripts/dist/stage-native.sh macos-universal dist build-arm64 build-x64
      - name: Check the shared library (a host build against the package, both architectures)
        env:
          CONSUMER_CMAKE_ARGS: -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64
        run: |
          scripts/dist/check-shared.sh dist/shared
          nm -gU dist/shared/lib/libjsui.dylib | grep -q ' _jsui_gpu_create_metal$'
          # The Unity plugin's Metal path (a native rendering plugin; built
          # against integrations/unity/native/unity_api, no Unity install here).
          nm -gU dist/unity/jsui_unity.bundle/Contents/MacOS/jsui_unity | grep -q ' _UnityPluginLoad$'
      - name: Viewer smoke (the staged binary)
        run: |
          dist/viewer/jsui-viewer --width 320 --height 200 --frames 10 --screenshot viewer.png web/test/fixtures/bands.js | tee viewer.log
          grep -q '^GPU: ' viewer.log
          test -s viewer.png
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-native-macos-universal
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-shared-macos-universal
          path: dist/shared/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-unity-macos-universal
          path: dist/unity/
          if-no-files-found: error

  dist-windows:
    name: dist (windows-x64)
    runs-on: windows-2022
    needs: [changes, skia-windows]
    if: ${{ !cancelled() && needs.skia-windows.result == 'success' && (github.event_name != 'pull_request' || needs.changes.outputs.dist == 'true') }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Desktop Skia m157 (Graphite + Vulkan, Ganesh + GL + D3D12; built by skia-windows)
        uses: actions/cache/restore@v4
        with:
          path: third_party/skia-desktop
          key: ${{ needs.skia-windows.outputs.key }}
          fail-on-cache-miss: true
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build/_deps/*-src
          key: dist-deps-m157-${{ runner.os }}-${{ hashFiles('cmake/*.cmake', 'integrations/godot/CMakeLists.txt', 'tools/jsui-viewer/CMakeLists.txt') }}
          restore-keys: dist-deps-m157-${{ runner.os }}-
      - name: MSVC environment (Windows SDK, link libraries)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Ninja
        run: pip install ninja==1.13.0
      - name: sccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: windows-dist
          max-size: 1G
      - name: Configure
        # clang-cl from LLVM and the static C runtime, as Skia is built.
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_C_COMPILER=C:/Program Files/LLVM/bin/clang-cl.exe" "-DCMAKE_CXX_COMPILER=C:/Program Files/LLVM/bin/clang-cl.exe"
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DJSUI_SKIA_DIR=third_party/skia-desktop
          -DJSUI_BUILD_SHARED=ON -DJSUI_BUILD_TESTS=OFF
          -DJSUI_BUILD_GODOT=ON -DJSUI_GODOT_OUTPUT_DIR="$(pwd -W)/build/godot"
          -DJSUI_BUILD_UNITY=ON -DJSUI_UNITY_PLUGIN_DIR="$(pwd -W)/build/unity"
      - name: Build
        run: cmake --build build -j 4 --target jsui_shared jsui-viewer jsui_godot jsui_unity
      - name: Stage
        run: scripts/dist/stage-native.sh windows-x64 dist build
      - name: Check the shared library (a host build against the package)
        run: scripts/dist/check-shared.sh dist/shared
      - name: Check the Unity plugin (loads; exports the plugin entry points, the C API and the helpers)
        # Built with the GPU path (Vulkan, Direct3D 11 / 12); Unity itself
        # cannot run here.
        run: |
          grep -q 'JSUI_VULKAN:BOOL=ON' build/CMakeCache.txt && grep -q 'JSUI_D3D:BOOL=ON' build/CMakeCache.txt
          test -f dist/unity/icudtl.dat
          python -c "
          import ctypes, sys
          d = ctypes.CDLL(sys.argv[1])
          for f in ['UnityPluginLoad', 'UnityPluginUnload', 'jsui_create', 'jsui_render_gpu_target', 'jsuiu_create', 'jsuiu_gpu_available', 'jsuiu_render_event_func']:
              getattr(d, f)
          print('jsui_unity.dll: ok')
          " "$(cygpath -w dist/unity/jsui_unity.dll)"
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-native-windows-x64
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-shared-windows-x64
          path: dist/shared/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-unity-windows-x64
          path: dist/unity/
          if-no-files-found: error

  # Advisory, like the iOS job: the release attaches the xcframework when this
  # succeeded and goes without it otherwise.
  dist-ios:
    name: dist (ios-xcframework, advisory)
    runs-on: macos-15
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.dist == 'true'
    continue-on-error: true
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Cache iOS Skia (device + simulator)
        uses: actions/cache@v4
        with:
          path: third_party/skia-ios
          key: skia-ios-dist-${{ hashFiles('scripts/build-skia-ios.sh') }}
      - name: Tools
        run: command -v ninja || brew install ninja
      - name: Build JSUI.xcframework (builds the Skia slices on a cache miss)
        run: scripts/dist/build-ios-xcframework.sh dist-ios
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-ios-xcframework
          path: dist-ios/
          if-no-files-found: error

  # What the release would attach, assembled from the artifacts above with
  # the release script (scripts/dist/assemble-release.sh), so a broken
  # archive shows up here and not on a tag.
  dist-assemble:
    name: dist (release archives)
    runs-on: ubuntu-24.04
    needs: [dist-linux, dist-macos, dist-windows, dist-ios]
    if: ${{ !cancelled() && needs.dist-linux.result == 'success' && needs.dist-macos.result == 'success' && needs.dist-windows.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: jsui-native-*
          path: artifacts
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: jsui-ios-xcframework
          path: artifacts/jsui-ios-xcframework
      - name: Assemble
        run: |
          v=$(node -p "require('./packages/react/package.json').version")
          scripts/dist/assemble-engines.sh "$v" artifacts release upm
          scripts/dist/assemble-release.sh "$v" artifacts release
      - name: Check the archives
        run: |
          cd release
          sha256sum -c SHA256SUMS.txt
          unzip -l jsui-godot-*.zip | tee godot.txt
          for f in linux.x86_64.so linux.arm64.so windows.x86_64.dll macos.universal.dylib; do grep -q "addons/jsui/bin/libjsui_godot.$f" godot.txt; done
          unzip -p jsui-godot-*.zip addons/jsui/jsui.gdextension
          for f in *.tar.gz; do tar -tzf "$f" | grep -q '/lib/cmake/jsui/jsuiConfig.cmake$'; done
          unzip -l jsui-*-windows-x64.zip | grep -q 'bin/jsui.dll'
          tar -tzf com.orktes.jsui-*.tgz | tee unity.txt
          for f in package.json Plugins/macOS/jsui_unity.bundle/Contents/MacOS/jsui_unity Plugins/macOS/jsui_unity.bundle.meta \
                   Plugins/Linux/x86_64/libjsui_unity.so Plugins/Linux/x86_64/libjsui_unity.so.meta \
                   Plugins/Windows/x86_64/jsui_unity.dll Plugins/Windows/x86_64/jsui_unity.dll.meta \
                   Plugins/Windows/x86_64/icudtl.dat Plugins/Windows/x86_64/icudtl.dat.meta \
                   Editor/JsuiBuildPostprocess.cs Editor/Jsui.Editor.asmdef; do grep -qx "package/$f" unity.txt; done
          # An immutable package needs a .meta for every entry (the .bundle's insides aside).
          grep -v '\.meta$' unity.txt | grep -v '^package/$' | grep -v '\.bundle/' | sed 's|/$||' | while read -r e; do
            grep -qx "$e.meta" unity.txt || { echo "::error::$e has no .meta"; exit 1; }
          done
          unzip -l jsui-unreal-*.zip | tee unreal.txt
          for f in Jsui.uplugin lib/libjsui.dylib lib/libjsui.so lib/jsui.lib bin/jsui.dll bin/icudtl.dat include/jsui/jsui.h; do
            grep -q "Jsui/\(Source/ThirdParty/JsuiLibrary/\)\?$f\$" unreal.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-release-preview
          path: release/

  # --------------------------------------------------------------------- wasm
  wasm:
    name: wasm (emscripten + browser)
    runs-on: ubuntu-24.04
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.wasm == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build rsync
      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: third_party/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('scripts/setup-emsdk.sh') }}
      - name: Cache Skia for WASM
        id: skia-wasm-cache
        uses: actions/cache@v4
        with:
          path: third_party/skia-wasm
          key: skia-wasm-${{ runner.os }}-${{ hashFiles('scripts/build-skia-wasm.sh', 'scripts/setup-emsdk.sh') }}
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build-wasm/_deps/*-src
          key: wasm-deps-${{ hashFiles('cmake/*.cmake') }}
      - name: emsdk
        run: scripts/setup-emsdk.sh
      - name: Skia for WASM (cache miss only, ~30 min)
        if: steps.skia-wasm-cache.outputs.cache-hit != 'true'
        run: JOBS=$(nproc) scripts/build-skia-wasm.sh
      - name: Build jsui.wasm
        run: JOBS=$(nproc) scripts/build-wasm.sh Release
      - name: Node smoke test
        run: node web/test/node-smoke.mjs && JSUI_JS=host node web/test/node-smoke.mjs
      # jsui screenshot / inspect / run (the CLI's headless runtime) on the module just built,
      # on QuickJS and on the host JS engine (Node's V8), and QuickJS / host parity.
      - name: CLI headless tests (screenshot / inspect / run on web/dist)
        run: |
          npm ci --no-audit --no-fund
          JSUI_HEADLESS_STRICT=1 node --test packages/cli/test/headless.test.js packages/cli/test/hostjs.test.js
          JSUI_HEADLESS_STRICT=1 JSUI_JS=host node --test packages/cli/test/headless.test.js
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json', 'web/package.json') }}
      - name: Browser tests (Playwright / Chromium)
        working-directory: web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install chromium
          JSUI_WEB_STRICT=1 npm run test:browser
          JSUI_WEB_STRICT=1 JSUI_JS=quickjs npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-wasm
          path: web/dist

  # ------------------------------------------------------- wasm, GPU variant
  # Skia with Ganesh + WebGL (WEBGL=1): its own Skia cache key and output dir
  # (web/dist-webgl), so the CPU wasm job above is unaffected. The browser
  # tests run against the GPU module (renderer 'gpu' tests draw through Skia
  # on SwiftShader WebGL and compare with the CPU path).
  wasm-webgl:
    name: wasm webgl (emscripten + browser, GPU)
    runs-on: ubuntu-24.04
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.wasm == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build rsync
      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: third_party/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('scripts/setup-emsdk.sh') }}
      - name: Cache Skia for WASM (WebGL)
        id: skia-wasm-webgl-cache
        uses: actions/cache@v4
        with:
          path: third_party/skia-wasm-webgl
          key: skia-wasm-webgl-${{ runner.os }}-${{ hashFiles('scripts/build-skia-wasm.sh', 'scripts/setup-emsdk.sh') }}
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build-wasm-webgl/_deps/*-src
          key: wasm-webgl-deps-${{ hashFiles('cmake/*.cmake') }}
      - name: emsdk
        run: scripts/setup-emsdk.sh
      - name: Skia for WASM + WebGL (cache miss only, ~40 min)
        if: steps.skia-wasm-webgl-cache.outputs.cache-hit != 'true'
        run: WEBGL=1 JOBS=$(nproc) scripts/build-skia-wasm.sh
      - name: Build jsui.wasm (GPU)
        run: WEBGL=1 JOBS=$(nproc) scripts/build-wasm.sh Release
      - name: Node smoke test (GPU module, CPU path)
        run: JSUI_WEB_DIST=dist-webgl node web/test/node-smoke.mjs
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json', 'web/package.json') }}
      - name: Browser tests against the GPU module (Playwright / Chromium)
        working-directory: web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install chromium
          JSUI_WEB_STRICT=1 JSUI_WEB_DIST=dist-webgl npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-wasm-webgl
          path: web/dist-webgl
      # The showcase site (site/, deployed by pages.yml) runs on this module
      # with the GPU renderer: build it and open every route in Chromium (no
      # runtime errors, nothing blank). No WebGPU module here, so the page
      # keeps the runtime on its main thread (its default without WebGPU).
      - name: Site (build + smoke test, GPU module)
        run: |
          npm ci --no-audit --no-fund
          node site/scripts/build.mjs --wasm web/dist-webgl --wasm-webgl web/dist-webgl
          SITE_EXPECT_WORKER=0 node site/test/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-screenshots
          path: site/test/output
          if-no-files-found: ignore

  # ---------------------------------------------- wasm, WebGPU variant, advisory
  # Skia chrome/m157 with Graphite (Dawn backend on Emdawnwebgpu) + Ganesh
  # WebGL + CPU in one module (GPU=1 -> web/dist-gpu), built with its own
  # emsdk (6.0.13). Headless Chromium gets WebGPU from --enable-unsafe-webgpu
  # (a SwiftShader fallback adapter). Advisory while Graphite-on-wasm is new:
  # the Skia patch tracks an API Skia does not support upstream yet.
  wasm-webgpu:
    name: wasm webgpu (emscripten + browser, Graphite, advisory)
    runs-on: ubuntu-24.04
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.wasm == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build rsync
      - name: Cache Skia for WASM (Graphite) + its emsdk and Emdawnwebgpu
        uses: actions/cache@v4
        with:
          path: |
            third_party/skia-wasm-gpu
            third_party/emsdk-6.0.13
            third_party/emdawnwebgpu
          key: skia-wasm-gpu-${{ runner.os }}-${{ hashFiles('scripts/build-skia-wasm-graphite.sh', 'scripts/setup-emsdk.sh', 'scripts/setup-emdawnwebgpu.sh', 'scripts/patches/skia-m157-emdawnwebgpu.patch') }}
      - name: Build jsui.wasm (WebGPU + WebGL + CPU; builds Skia on a cache miss)
        run: GPU=1 JOBS=$(nproc) scripts/build-wasm.sh Release
      - name: Node smoke test (WebGPU module, CPU path)
        run: JSUI_WEB_DIST=dist-gpu node web/test/node-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-wasm-gpu
          path: web/dist-gpu

  # The Godot integration's threaded web build (for the godot-aw3 fork's
  # threaded web export template, integrations/godot/README.md "Threaded web
  # build"): threaded Skia (emsdk 4.0.20 + its Emdawnwebgpu, -pthread), JSUI
  # with the JS thread, one relocatable object with local symbols, and a link
  # check against a program with its own copies of Skia's libraries. The fork
  # itself is not built here.
  godot-web:
    name: godot web (threaded wasm library, advisory)
    runs-on: ubuntu-24.04
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.wasm == 'true' || needs.changes.outputs.godot == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build rsync
      - name: Cache threaded Skia for WASM + its emsdk
        uses: actions/cache@v4
        with:
          path: |
            third_party/skia-wasm-mt
            third_party/emsdk-4.0.20
          key: skia-wasm-mt-${{ runner.os }}-${{ hashFiles('scripts/build-skia-wasm-mt.sh', 'scripts/setup-emsdk.sh', 'scripts/patches/skia-m157-emdawnwebgpu.patch') }}
      - name: Build libjsui_godot.web.threads.wasm32.a + link check (builds Skia on a cache miss)
        run: JOBS=$(nproc) scripts/build-godot-web.sh Release
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-godot-web-threads
          path: integrations/godot/demo/bin/libjsui_godot.web.threads.wasm32.a

  # The WebGPU module's browser tests, split in three (JSUI_WEB_SHARD) so they
  # run in parallel with each other and with the site check below.
  wasm-webgpu-test:
    name: wasm webgpu browser tests (${{ matrix.shard }}/3, advisory)
    runs-on: ubuntu-24.04
    needs: wasm-webgpu
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: jsui-wasm-gpu
          path: web/dist-gpu
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json', 'web/package.json') }}
      # The workspace install gives the browser tests @orktes/jsui-cli, which
      # builds the interactions showcase for the WebGPU perf guards (steady
      # frames, raster cache, layers); without it those tests skip.
      - name: Install workspace packages
        run: npm ci --no-audit --no-fund
      - name: Browser tests against the WebGPU module (Playwright / Chromium)
        working-directory: web
        env:
          JSUI_WEB_SHARD: ${{ matrix.shard }}/3
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install chromium
          JSUI_WEB_STRICT=1 JSUI_WEB_DIST=dist-gpu npm run test:browser

  wasm-webgpu-site:
    name: wasm webgpu site smoke test (advisory)
    runs-on: ubuntu-24.04
    needs: wasm-webgpu
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: jsui-wasm-gpu
          path: web/dist-gpu
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json', 'web/package.json') }}
      - name: Install workspace packages
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium
      # In worker mode (the page's default with WebGPU) on the browser's own JS
      # engine, then on QuickJS (?js=quickjs), then on the page's main thread
      # (?worker=0).
      - name: Site (build + smoke test on WebGPU)
        run: |
          node site/scripts/build.mjs --wasm web/dist-gpu --wasm-webgl web/dist-gpu --wasm-gpu web/dist-gpu
          SITE_WEBGPU=1 SITE_EXPECT_RENDERER=webgpu SITE_EXPECT_WORKER=1 node site/test/smoke.mjs
          SITE_JS=quickjs SITE_WEBGPU=1 SITE_EXPECT_RENDERER=webgpu SITE_EXPECT_WORKER=1 node site/test/smoke.mjs
          SITE_WORKER=0 SITE_WEBGPU=1 SITE_EXPECT_RENDERER=webgpu SITE_EXPECT_WORKER=0 node site/test/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-screenshots-webgpu
          path: site/test/output
          if-no-files-found: ignore

  # ----------------------------------------------------------------------- js
  js:
    name: js packages
    runs-on: ubuntu-24.04
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.js == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Tests (packages/*)
        run: npm run test:js
      - name: Tests (web host, no browser)
        run: node --test web/test/textures.test.mjs web/test/audio.test.mjs web/test/components.test.mjs
      # The packed tarballs, installed outside the monorepo, must bundle an app
      # (catches a file missing from "files" or a workspace-only resolution).
      - name: Packed packages (install + build outside the workspace)
        run: |
          tgz="$RUNNER_TEMP/tgz" app="$RUNNER_TEMP/app"
          mkdir -p "$tgz" "$app"
          npm pack --workspace packages/react --workspace packages/cli --pack-destination "$tgz"
          # @orktes/jsui-cli depends on @orktes/jsui-web (its headless runtime); pack it
          # too (without the WASM builds, which this job does not have).
          npm pack --workspace web --ignore-scripts --pack-destination "$tgz"
          cd "$app"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$tgz"/*.tgz
          printf '%s\n' "import { AppRegistry, View, Text } from 'react-native';" \
            "AppRegistry.registerComponent('main', () => () => <View><Text>Hello</Text></View>);" > app.jsx
          npx jsui build app.jsx -o out/bundle.js
          test -s out/bundle.js
          npx jsui skill install . && test -s .claude/skills/jsui/SKILL.md
          npx jsui skill print --all | grep -q 'name: jsui'

  # ---------------------------------------------------------------- reference
  reference:
    name: reference (jsui vs react-native-web)
    runs-on: ubuntu-24.04
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.reference == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang libfontconfig1-dev zlib1g-dev
      - name: Cache prebuilt Skia + FetchContent sources
        uses: actions/cache@v4
        with:
          path: |
            third_party/skia-prebuilt
            build/_deps/*-src
          key: native-deps-${{ runner.os }}-${{ hashFiles('cmake/*.cmake', 'tools/**/CMakeLists.txt') }}
          restore-keys: native-deps-${{ runner.os }}-
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: reference-${{ runner.os }}
          max-size: 500M
      - name: Build jsui-render
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DJSUI_BUILD_TESTS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j "$(nproc)" --target jsui-render
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json', 'web/package.json') }}
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Reference tests
        run: npm run test:reference
      - name: JS debugger end to end (jsui dev + a dev-mode native runtime)
        env:
          JSUI_RENDER: build/jsui-render
        run: node --test packages/cli/test/inspect-native.test.js
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-report
          path: tests/reference/output
          if-no-files-found: warn

  # --------------------------------------------------- reference (macOS), advisory
  # Same suite against Chrome on macOS (CoreText text on both sides). Only
  # jsui-render is built; Skia and FetchContent sources are cached.
  reference-macos:
    name: reference (macOS, jsui vs react-native-web)
    runs-on: macos-14
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.reference == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache prebuilt Skia
        uses: actions/cache@v4
        with:
          path: third_party/skia-prebuilt
          key: skia-prebuilt-macos-14-${{ hashFiles('cmake/Deps.cmake') }}
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build/_deps/*-src
          key: reference-macos-deps-${{ hashFiles('cmake/*.cmake') }}
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: reference-${{ runner.os }}
          max-size: 500M
      - name: Build jsui-render
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJSUI_BUILD_TESTS=OFF -DJSUI_BUILD_VIEWER=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j "$(sysctl -n hw.ncpu)" --target jsui-render
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json', 'web/package.json') }}
      - name: Chromium
        run: npx playwright install chromium
      - name: Reference tests
        run: npm run test:reference
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-report-macos
          path: tests/reference/output
          if-no-files-found: warn

  # ----------------------------------------------- native (macOS, prebuilt), advisory
  native-other:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.native == 'true'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Cache prebuilt Skia
        uses: actions/cache@v4
        with:
          path: third_party/skia-prebuilt
          key: skia-prebuilt-${{ matrix.os }}-${{ hashFiles('cmake/Deps.cmake') }}
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Native tests (macOS)
        if: runner.os == 'macOS'
        # gpu_test makes a headless CGL 3.2 core context (Apple's software
        # renderer if there is no GPU); require it so GPU cases cannot SKIP.
        env:
          JSUI_GPU_TEST_REQUIRE: 1
        run: ./build/jsui-tests
      - name: Viewer GPU smoke (macOS, SDL + 3.2 core profile)
        if: runner.os == 'macOS'
        run: |
          ./build/tools/jsui-viewer/jsui-viewer --gpu --width 320 --height 200 \
            --frames 10 --screenshot bands-gpu.png web/test/fixtures/bands.js | tee viewer-gpu.log
          grep -q '^GPU: ' viewer-gpu.log  # not the CPU fallback
          test -s bands-gpu.png

  # ------------------------------------------------------ Android, advisory
  # Compile + package: Skia for Android (Ganesh on GLES) is built from source
  # with the NDK (scripts/build-skia-android.sh) and cached on the script's
  # hash; then the JsuiDemo APK is built for arm64-v8a. The hosted runner
  # has the Android SDK; the NDK / build-tools / platform are pinned here.
  android:
    name: Android (APK build)
    runs-on: ubuntu-24.04
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.android == 'true'
    continue-on-error: true
    timeout-minutes: 90
    env:
      NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Android NDK, build-tools, platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "build-tools;35.0.0" "platforms;android-35" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          sudo apt-get update > /dev/null && sudo apt-get install -y --no-install-recommends ninja-build rsync zip > /dev/null
      - name: Cache Android Skia
        id: skia
        uses: actions/cache@v4
        with:
          path: third_party/skia-android
          key: skia-android-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/build-skia-android.sh') }}
      - name: Skia (android-arm64)
        if: steps.skia.outputs.cache-hit != 'true'
        run: CPUS=arm64 scripts/build-skia-android.sh
      - name: Install
        run: npm ci
      - name: Build JsuiDemo.apk
        run: scripts/build-android.sh
      - name: Check the APK
        run: |
          unzip -l build-android/JsuiDemo.apk | tee /dev/stderr | grep -q 'lib/arm64-v8a/libjsuidemo.so'
          unzip -l build-android/JsuiDemo.apk | grep -q 'assets/ui/bundle.js'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify build-android/JsuiDemo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jsui-android-apk
          path: build-android/JsuiDemo.apk
          retention-days: 14

  # ------------------------------------------------- iOS (simulator), advisory
  # Compile-only: Skia for iOS (Ganesh on Metal) is built from source
  # (scripts/build-skia-ios.sh, long on a hosted runner) and cached on the
  # script's hash; then the JsuiDemo app is built for the arm64 simulator.
  ios:
    name: iOS (simulator build)
    runs-on: macos-15
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.ios == 'true'
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache iOS Skia
        id: skia
        uses: actions/cache@v4
        with:
          path: third_party/skia-ios
          key: skia-ios-${{ hashFiles('scripts/build-skia-ios.sh') }}
      - name: Tools
        run: command -v ninja || brew install ninja
      - name: Skia (iphonesimulator-arm64)
        if: steps.skia.outputs.cache-hit != 'true'
        run: SLICES=iphonesimulator-arm64 scripts/build-skia-ios.sh
      - name: Install
        run: npm ci
      - name: Build JsuiDemo.app
        run: scripts/build-ios.sh
      - name: Check the app bundle
        run: |
          test -x build-ios-sim/integrations/ios/JsuiDemo.app/JsuiDemo
          test -s build-ios-sim/integrations/ios/JsuiDemo.app/ui/bundle.js
