name: Release

# Publishes @orktes/jsui-react, @orktes/jsui-cli and @orktes/jsui-web to npm with trusted
# publishing (GitHub OIDC; provenance is attached automatically and there is
# no npm token anywhere), and attaches the prebuilt native binaries to the
# GitHub Release of the tag. Nothing is compiled here: the WASM modules for
# @orktes/jsui-web and the native binaries are the artifacts of the CI run on
# main for the released commit (the WASM ones are what pages.yml deploys).
# See docs/RELEASING.md.
#
# Trigger: push a tag vX.Y.Z on a main commit whose CI run succeeded, or run
# it by hand on main. Versions already on npm are skipped, so re-running a
# partly failed release is safe.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read    # download the CI run's artifacts
  id-token: write  # npm trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    # npm trusted publishing only accepts GitHub-hosted runners.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing (>= 11.5.1)
        run: npm install -g npm@11.12.1 && npm --version
      - name: Check versions
        id: version
        run: |
          v=$(node -p "require('./packages/react/package.json').version")
          for p in packages/cli web; do
            pv=$(node -p "require('./$p/package.json').version")
            [ "$pv" = "$v" ] || { echo "::error::$p is $pv, packages/react is $v"; exit 1; }
          done
          dep=$(node -p "require('./packages/cli/package.json').dependencies['@orktes/jsui-react']")
          [ "$dep" = "$v" ] || { echo "::error::@orktes/jsui-cli depends on @orktes/jsui-react $dep, not $v"; exit 1; }
          dep=$(node -p "require('./packages/cli/package.json').dependencies['@orktes/jsui-web']")
          [ "$dep" = "$v" ] || { echo "::error::@orktes/jsui-cli depends on @orktes/jsui-web $dep, not $v"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version $v"; exit 1
          fi
          case "$v" in *-*) tag=next ;; *) tag=latest ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $v (dist-tag $tag)"
      - name: Find the CI run for this commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --commit "$GITHUB_SHA" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          [ -n "$id" ] || { echo "::error::no successful CI run on main for $GITHUB_SHA (merge to main and wait for CI first)"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: WASM module (CPU)
        uses: actions/download-artifact@v4
        with:
          name: jsui-wasm
          path: web/dist
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: WASM module (WebGL)
        uses: actions/download-artifact@v4
        with:
          name: jsui-wasm-webgl
          path: web/dist-webgl
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: WASM module (WebGPU + WebGL + CPU)
        uses: actions/download-artifact@v4
        with:
          name: jsui-wasm-gpu
          path: web/dist-gpu
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Tests
        run: npm run test:js && node web/test/node-smoke.mjs
      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Dependency order: @orktes/jsui-cli depends on @orktes/jsui-react and @orktes/jsui-web.
          for ws in packages/react web packages/cli; do
            name=$(node -p "require('./$ws/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on npm, skipping"
              continue
            fi
            npm publish --workspace "$ws" --access public --tag "$DIST_TAG"
          done
      # The one-liner in the READMEs, from the registry with nothing installed.
      - name: Smoke test (npx @orktes/jsui-cli skill install)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dir="$RUNNER_TEMP/npx-smoke"
          mkdir -p "$dir" && cd "$dir"
          for i in $(seq 60); do  # new versions take minutes to show up
            npm view "@orktes/jsui-cli@$VERSION" version >/dev/null 2>&1 && break
            sleep 10
          done
          npx --yes "@orktes/jsui-cli@$VERSION" skill install
          test -s .claude/skills/jsui/SKILL.md

  # The prebuilt native binaries on the GitHub Release of the tag: the dist-*
  # artifacts of the same CI run, assembled by scripts/dist/assemble-release.sh
  # (per-platform archives with the shared library, header, CMake package and
  # viewer; the Godot addon zip; the iOS xcframework when its advisory job
  # succeeded; SHA256SUMS.txt). Re-running replaces the assets.
  binaries:
    name: GitHub Release binaries
    # Tag pushes only (a manual run on main publishes to npm alone); to redo
    # a release's binaries, re-run the tag's workflow run.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # create the release, upload assets
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Version and tag
        id: version
        run: |
          v=$(node -p "require('./packages/react/package.json').version")
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "::error::tag ${GITHUB_REF_NAME} does not match package version $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Find the CI run for this commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --commit "$GITHUB_SHA" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          [ -n "$id" ] || { echo "::error::no successful CI run on main for $GITHUB_SHA (merge to main and wait for CI first)"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: jsui-native-*
          path: artifacts
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: iOS xcframework (when its advisory job succeeded)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: jsui-ios-xcframework
          path: artifacts/jsui-ios-xcframework
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Assemble
        run: |
          for p in linux-x64 linux-arm64 macos-universal windows-x64; do
            [ -d "artifacts/jsui-native-$p" ] || { echo "::error::the CI run has no jsui-native-$p artifact"; exit 1; }
          done
          # The Unity package and the Unreal plugin first: the release script's
          # SHA256SUMS.txt covers them.
          scripts/dist/assemble-engines.sh "${{ steps.version.outputs.version }}" artifacts release upm
          scripts/dist/assemble-release.sh "${{ steps.version.outputs.version }}" artifacts release
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            pre=""
            case "$VERSION" in *-*) pre="--prerelease" ;; esac
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --verify-tag --title "JSUI $VERSION" --generate-notes $pre
          fi
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber release/*
      # Unity's git URL install, https://github.com/orktes/jsui.git#upm (or
      # #upm/vX.Y.Z for a fixed version): the package tree with the prebuilt
      # plugins, one commit per release on the orphan branch `upm`.
      - name: Update the upm branch
        if: ${{ !contains(steps.version.outputs.version, '-') }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/upm/v$VERSION" >/dev/null; then
            echo "upm/v$VERSION exists already (a re-run): leaving the upm branch as it is"; exit 0
          fi
          dir="$RUNNER_TEMP/upm-branch"
          if git fetch --depth 1 origin upm 2>/dev/null; then
            git worktree add "$dir" FETCH_HEAD
            git -C "$dir" switch -c upm
          else
            git worktree add --orphan -b upm "$dir"
          fi
          git -C "$dir" rm -rq --ignore-unmatch .
          cp -R upm/. "$dir/"
          git -C "$dir" add -A
          git -C "$dir" commit -qm "com.orktes.jsui $VERSION" --allow-empty
          git -C "$dir" tag "upm/v$VERSION"
          git -C "$dir" push origin upm "upm/v$VERSION"
