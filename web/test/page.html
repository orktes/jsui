<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>jsui-web test page</title>
  <style>
    html, body { margin: 0; background: #ffffff; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module">
    import { createJsui } from '../jsui-web.js';
    // page.html?js=host: every runtime's default JS engine (createJsui's `js`).
    const js = new URLSearchParams(location.search).get('js');
    window.createJsui = js ? (opts) => createJsui({ js, ...opts }) : createJsui;
    window.testReady = true;
  </script>
</body>
</html>
