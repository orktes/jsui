<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JSUI · React Native game UI, everywhere</title>
  <meta name="description" content="JSUI is an embeddable game UI runtime: write React Native, ship it inside your engine. This whole site is rendered by JSUI compiled to WebAssembly.">
  <meta name="theme-color" content="#05070f">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #05070f; }
    #ui { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              gap: 18px; color: #a3aecb; font: 500 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
              transition: opacity .45s ease; pointer-events: none; }
    #splash.gone { opacity: 0; }
    #splash .mark { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center;
                    background: linear-gradient(135deg, #ffe29a, #f2c35b 45%, #4fd1ff); animation: pulse 1.4s ease-in-out infinite; }
    #splash .mark i { width: 16px; height: 16px; border-radius: 4px; background: #05070f; transform: rotate(45deg); }
    #splash .bar { width: 180px; height: 3px; border-radius: 2px; background: #151d33; overflow: hidden; }
    #splash .bar b { display: block; height: 100%; width: 30%; background: #f2c35b; animation: slide 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(.92); opacity: .8; } }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(330%); } }
    #err { position: fixed; left: 12px; right: 12px; bottom: 12px; max-height: 40vh; overflow: auto; padding: 10px 12px;
           border-radius: 8px; background: #3d1214ee; color: #ffdcd7; font: 12px/1.4 ui-monospace, monospace;
           white-space: pre-wrap; display: none; z-index: 2; }
  </style>
</head>
<body>
  <canvas id="ui" aria-label="JSUI showcase (rendered by the JSUI WebAssembly runtime)"></canvas>
  <div id="splash"><div class="mark"><i></i></div><div>Booting the JSUI runtime…</div><div class="bar"><b></b></div></div>
  <div id="err"></div>
  <noscript><p style="color:#eef2ff;font:16px system-ui;padding:24px">This site is rendered by a WebAssembly UI runtime and needs JavaScript.</p></noscript>
  <script type="module">
    import { createJsui } from './jsui-web.js';

    // Query options: ?renderer=auto|gpu|webgpu|webgl|cpu|2d (default: gpu,
    // i.e. Skia on WebGPU, else on WebGL, else the CPU raster, when a GPU
    // module is deployed), ?stats=1 logs frame timings, ?dev=<bundle url>
    // runs a `jsui dev` bundle with live reload inside this page.
    const q = new URLSearchParams(location.search);
    const err = document.getElementById('err');
    const splash = document.getElementById('splash');
    const showError = (msg) => { err.textContent = msg; err.style.display = msg ? 'block' : 'none'; };

    // The deployed modules and their versions (content hashes). Every URL
    // this page loads is versioned (?v=<hash>), so a browser that cached
    // files of an earlier deploy still loads one consistent set.
    const modules = null;  // set by site/scripts/build.mjs
    const renderer = q.get('renderer') || (modules.gpu || modules.webgpu ? 'gpu' : 'auto');
    // The host picks the module (jsui/dist-gpu, dist-webgl or dist) for the
    // renderer and what the browser has, among the deployed ones.
    const route = () => decodeURIComponent(location.hash.replace(/^#/, '')) || '/';

    try {
      const jsui = await createJsui({
        canvas: document.getElementById('ui'),
        bundleUrl: q.get('dev') || './app/bundle.js',
        devMode: !!q.get('dev'),
        renderer,
        moduleBase: new URL('./jsui/', location.href),
        moduleVersions: modules.versions,
        // Big canvases at 3x cost a lot of fill for little gain.
        pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      });
      window.jsui = jsui;
      jsui.on('error', showError);
      jsui.on('message', (name, data) => {
        if (name === 'ready') jsui.postMessage('route', route());
        else if (name === 'route') {
          if (route() !== data) history.pushState(null, '', data === '/' ? location.pathname + location.search : '#' + data);
          document.title = 'JSUI · ' + (data === '/' ? 'React Native game UI, everywhere' : data.split('/')[1].replace(/^\w/, (c) => c.toUpperCase()));
        } else if (name === 'jsui:openURL') window.open(data.url, '_blank', 'noopener');
        else if (name === 'title') document.title = data;
        else if (name === 'cinematic') cinematic(data);
      });
      const cinematic = trailerPlayer(jsui, { autoplay: q.get('autoplay') !== '0' });
      addEventListener('popstate', () => jsui.postMessage('route', route()));
      addEventListener('hashchange', () => jsui.postMessage('route', route()));
      if (q.get('stats') === '1') {
        let last = 0;
        jsui.on('frame', (s) => {
          const now = performance.now();
          if (now - last > 1000) { last = now; console.log(`[jsui ${jsui.renderer}] tick ${s.tickMs.toFixed(2)} ms, paint ${s.renderMs.toFixed(2)} ms, blit ${s.blitMs.toFixed(2)} ms`); }
        });
      }
      await jsui.whenIdle();
      splash.classList.add('gone');
      setTimeout(() => splash.remove(), 600);
    } catch (e) {
      showError('Could not start the JSUI runtime: ' + (e && e.stack || e));
    }

    // The /screens/cinematic trailer. JSUI plays no video: this page owns a
    // <video>, keeps the host texture 'trailer' current with jsui.bindVideo()
    // and reports playback through HostState 'cinematic' ({ status, muted,
    // duration, backend, quality }) and frame data 'cinematic.time'
    // ([fraction, buffered fraction, seconds]). The UI sends { cmd } messages.
    // Big Buck Bunny (c) 2008 Blender Foundation, peach.blender.org, CC BY 3.0,
    // streamed from Wikimedia Commons (CORS-enabled, so GPU uploads may read it).
    // ?autoplay=0: start paused and fetch nothing until play is pressed.
    function trailerPlayer(jsui, { autoplay }) {
      const BASE = 'https://upload.wikimedia.org/wikipedia/commons/transcoded/c/c0/Big_Buck_Bunny_4K.webm/Big_Buck_Bunny_4K.webm.';
      const SOURCES = { hd: { url: BASE + '1080p.vp9.webm', quality: '1080p VP9' }, sd: { url: BASE + '480p.vp9.webm', quality: '480p VP9' } };
      const POSTER = 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/Big_Buck_Bunny_4K.webm/1280px--Big_Buck_Bunny_4K.webm.jpg';
      let video = null, unbind = null, raf = 0, open = false, tried = [], last = '';
      const state = (patch) => jsui.patchState('cinematic', { backend: jsui.textureBackend, ...patch });
      const status = () => (!video ? 'idle' : video.error ? 'error' : video.ended ? 'ended'
        : video.paused ? 'paused' : video.readyState < 3 ? 'loading' : 'playing');
      const publish = () => state({ status: status(), muted: video ? video.muted : true,
        duration: video && isFinite(video.duration) ? video.duration : 0 });
      // Playback position as frame data, only when it moved (a paused page stays idle).
      const tick = () => {
        raf = open ? requestAnimationFrame(tick) : 0;
        if (!video) return;
        const d = isFinite(video.duration) && video.duration > 0 ? video.duration : 0, t = video.currentTime;
        const b = video.buffered.length ? video.buffered.end(video.buffered.length - 1) : 0;
        const key = `${t.toFixed(2)} ${b.toFixed(1)} ${d}`;
        if (key === last) return;
        last = key;
        jsui.setBuffer('cinematic.time', Float32Array.of(d ? t / d : 0, d ? b / d : 0, t));
      };
      // 1080p on the GPU paths; the CPU path copies every frame, so 480p there
      // (each falls back to the other when it does not load).
      const pick = () => {
        const order = jsui.textureBackend === 'pixels' ? ['sd', 'hd'] : ['hd', 'sd'];
        return order.find((k) => !tried.includes(k));
      };
      const load = () => {
        const k = pick();
        if (!k) return false;
        tried.push(k);
        video.src = SOURCES[k].url;
        state({ quality: SOURCES[k].quality });
        return true;
      };
      const create = () => {
        video = document.createElement('video');
        Object.assign(video, { crossOrigin: 'anonymous', muted: true, playsInline: true, preload: 'auto' });
        video.setAttribute('aria-hidden', 'true');
        // In the document (some browsers stop decoding detached or invisible videos), out of sight.
        Object.assign(video.style, { position: 'fixed', left: '0', top: '0', width: '2px', height: '2px', opacity: '0.01', pointerEvents: 'none', zIndex: '-1' });
        document.body.appendChild(video);
        for (const e of ['play', 'playing', 'pause', 'waiting', 'canplay', 'ended', 'volumechange', 'durationchange', 'seeked']) {
          video.addEventListener(e, publish);
        }
        video.addEventListener('error', () => {
          if (load()) video.play().catch(() => {});
          else publish();
        });
        // The poster (an <img>, another texture source) until the first frame.
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => { if (open && video && video.readyState < 2) jsui.setTexture('trailer', img); };
        img.src = POSTER;
        load();
      };
      const bind = () => { unbind ??= jsui.bindVideo('trailer', video); };
      const play = () => {
        if (!video) create();
        bind();
        if (video.error) {
          tried = [];
          load();
        }
        state({ status: 'loading' });
        video.play().catch(() => publish());  // autoplay refused: stays paused
      };
      jsui.on('renderer', () => state({}));
      return ({ cmd, ...a }) => {
        if (cmd === 'open') {
          open = true;
          if (!raf) raf = requestAnimationFrame(tick);
          if (autoplay) play();
          else if (video) bind();
          publish();
        } else if (cmd === 'close') {
          open = false;
          video?.pause();
          unbind?.();
          unbind = null;
          jsui.removeTexture('trailer');
        } else if (cmd === 'play') {
          if (video?.ended) video.currentTime = 0;
          play();
        } else if (cmd === 'pause') video?.pause();
        else if (cmd === 'mute') {
          if (video) video.muted = !!a.muted;  // from a click in the UI: a user activation
          publish();
        } else if (cmd === 'seek' && video) {
          const d = isFinite(video.duration) ? video.duration : 0;
          const to = a.fraction != null ? a.fraction * d : a.to;
          if (to >= 0) video.currentTime = d ? Math.min(to, d - 0.1) : to;
          if (a.play && video.paused) play();
        } else if (cmd === 'seek' && a.play) play();
      };
    }
  </script>
</body>
</html>
